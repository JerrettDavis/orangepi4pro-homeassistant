# Seed for NEW installations only. Restores never overwrite configuration.yaml.
default_config:

homeassistant:
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  mode: storage
  dashboards:
    dashboard-orangepi:
      mode: yaml
      title: Orange Pi
      icon: mdi:home-automation
      show_in_sidebar: true
      filename: dashboards/orangepi.yaml
