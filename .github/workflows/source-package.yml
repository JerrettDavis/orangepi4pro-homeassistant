name: Package source (not a disk image)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y age openssl
      - run: python -m pip install -e '.[test]'
      - run: ./scripts/test.sh -q
      - run: python scripts/package.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: orangepi4pro-homeassistant-source
          path: dist/*
          if-no-files-found: error
