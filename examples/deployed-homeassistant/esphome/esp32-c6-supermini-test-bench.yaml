substitutions:
  device_name: c6-aht10
  friendly_name: C6 AHT10
  i2c_sda_pin: '6'
  i2c_scl_pin: '7'
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  name_add_mac_suffix: false
esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf
logger:
  level: INFO
api:
  encryption:
    key: !secret 'esphome_esp32_c6_supermini_test_bench_api_encryption_key'
ota:
- platform: esphome
  password: !secret 'esphome_esp32_c6_supermini_test_bench_ota_0_password'
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  ap:
    ssid: C6-AHT10 Fallback
    password: !secret 'esphome_esp32_c6_supermini_test_bench_wifi_ap_password'
captive_portal: null
web_server:
  port: 80
i2c:
- id: board_i2c
  sda: GPIO${i2c_sda_pin}
  scl: GPIO${i2c_scl_pin}
  scan: true
  frequency: 50kHz
sensor:
- platform: aht10
  i2c_id: board_i2c
  variant: AHT10
  temperature:
    name: Temperature
    id: aht10_temperature
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
  humidity:
    name: Humidity
    id: aht10_humidity
    accuracy_decimals: 1
    device_class: humidity
    state_class: measurement
  update_interval: 30s
- platform: wifi_signal
  name: WiFi Signal
  id: wifi_signal_db
  update_interval: 60s
  entity_category: diagnostic
- platform: uptime
  name: Uptime
  id: device_uptime
  update_interval: 60s
  entity_category: diagnostic
text_sensor:
- platform: wifi_info
  ip_address:
    name: IP Address
    id: ip_address
    entity_category: diagnostic
  ssid:
    name: Connected SSID
    id: wifi_ssid_text
    entity_category: diagnostic
  mac_address:
    name: MAC Address
    id: mac_address
    entity_category: diagnostic
button:
- platform: restart
  name: Restart
  entity_category: diagnostic
