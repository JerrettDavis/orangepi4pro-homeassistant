esphome:
  name: esp32-c3-supermini-test-bench
  friendly_name: Esp32-C3 SuperMini Test Bench
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
api:
  encryption:
    key: !secret 'esphome_esp32_c3_supermini_test_bench_api_encryption_key'
ota:
- platform: esphome
  password: !secret 'esphome_esp32_c3_supermini_test_bench_ota_0_password'
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  ap:
    ssid: Esp32-C3-Supermini-Test-Bench
    password: !secret 'esphome_esp32_c3_supermini_test_bench_wifi_ap_password'
captive_portal: null
web_server:
  port: 80
uart:
  id: ld2420_uart
  tx_pin: GPIO5
  rx_pin: GPIO6
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 20ms
    sequence:
    - lambda: UARTDebug::log_hex(direction, bytes, ' ');
ld2420:
  uart_id: ld2420_uart
binary_sensor:
- platform: gpio
  name: LD2420 Presence Pin
  id: ld2420_presence_pin
  device_class: occupancy
  pin:
    number: GPIO4
    mode:
      input: true
      pullup: false
  filters:
  - delayed_off: 5s
sensor:
- platform: ld2420
  moving_distance:
    name: LD2420 Moving Distance
- platform: wifi_signal
  name: WiFi Signal
  update_interval: 60s
- platform: uptime
  name: Uptime
text_sensor:
- platform: ld2420
  fw_version:
    name: LD2420 Firmware
- platform: wifi_info
  ip_address:
    name: IP Address
  ssid:
    name: Connected SSID
  mac_address:
    name: MAC Address
button:
- platform: restart
  name: Restart ESP32
