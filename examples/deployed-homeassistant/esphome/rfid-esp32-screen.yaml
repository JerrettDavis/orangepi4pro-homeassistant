    - button:
        align: TOP_LEFT
        x: 86
        y: 198
        width: 68
        height: 42
        on_press:
          then:
          - homeassistant.action:
              action: light.turn_on
              data:
                entity_id: ${ent_maya_lamp}
                effect: Rainbow
          - script.execute: tap_beep
        widgets:
        - label:
            align: CENTER
            text_font: font_small
            text: Rainbow
    - button:
        align: TOP_LEFT
        x: 164
        y: 198
        width: 68
        height: 42
        on_press:
          then:
          - homeassistant.action:
              action: light.turn_on
              data:
                entity_id: ${ent_maya_lamp}
                effect: Nightlight
                brightness_pct: '10'
          - script.execute: tap_beep
        widgets:
        - label:
            align: CENTER
            text_font: font_small
            text: Night
  - id: page_rfid
    bg_color: 1053720
    bg_opa: COVER
    text_color: 16777215
    widgets:
    - label:
        align: TOP_MID
        y: 8
        text_font: font_medium
        text: RFID Reader
    - label:
        id: rfid_big
        align: CENTER
        y: -46
        text_font: font_large
        text: WAITING
    - label:
        id: rfid_uid
        align: CENTER
        y: 8
        width: 224
        long_mode: WRAP
        text_align: CENTER
        text_font: font_medium
        text: Scan a card
    - label:
        id: rfid_count
        align: BOTTOM_MID
        y: -50
        text_font: font_small
        text: 'Scans: 0'
interval:
- interval: 15s
  then:
  - if:
      condition:
        lambda: return id(display_is_awake) && id(ha_time).now().is_valid();
      then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda 'return id(ha_time).now().strftime("%I:%M");'
      - lvgl.label.update:
          id: lbl_date
          text: !lambda 'return id(ha_time).now().strftime("%a %b %d");'
- interval: 30s
  then:
  - if:
      condition:
        lambda: return id(display_is_awake);
      then:
      - lvgl.label.update:
          id: lbl_battery
          text: !lambda 'return str_sprintf("%.2f V", id(battery_voltage_estimated).state);'
      - lvgl.label.update:
          id: lbl_ssid
          text: !lambda 'return id(wifi_ssid_text).state;'
