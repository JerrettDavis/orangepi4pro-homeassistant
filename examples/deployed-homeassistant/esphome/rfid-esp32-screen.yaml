        on_press:
          then:
          - homeassistant.action:
              action: light.toggle
              data:
                entity_id: ${ent_sam_bed_light}
          - script.execute: tap_beep
        widgets:
        - label:
            align: CENTER
            text_font: font_small
            text: 'Sam Bed

              Light'
    - button:
        id: tile_maya_lamp
        align: TOP_LEFT
        x: 124
        y: 180
        width: 108
        height: 78
        on_press:
          then:
          - homeassistant.action:
              action: light.toggle
              data:
                entity_id: ${ent_maya_lamp}
          - script.execute: tap_beep
        widgets:
        - label:
            align: CENTER
            text_font: font_small
