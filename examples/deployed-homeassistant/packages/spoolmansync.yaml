        - action: system_log.write
          data:
            message: 'SPOOLMANSYNC PRINT END (skipped) | Tray: {{ tray_composite }}
              | Weight: {{ tray_weight }}g | Reason: {{ ''no tray in helper'' if tray_composite
              < 0 else ''no weight'' }}'
            level: '{{ ''warning'' if tray_weight >= 0.01 else ''info'' }}'
      - action: utility_meter.calibrate
        target:
          entity_id: sensor.spoolmansync_20p5aj661102691_filament_usage_meter
        data:
          value: '0'
      - action: system_log.write
        data:
          message: SPOOLMANSYNC METER RESET after print end
          level: info
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''offline'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ tray_composite >= 0 and tray_weight >= 0.01 and tray_sensor
              != '''' }}'
          sequence:
          - action: system_log.write
            data:
              message: 'SPOOLMANSYNC OFFLINE FLUSH | Tray {{ tray_composite }} | Sensor:
                {{ tray_sensor }} | Weight used: {{ tray_weight }}g'
              level: info
          - action: rest_command.spoolmansync_update_spool
            data:
              filament_name: '{{ name }}'
              filament_material: '{{ material }}'
              filament_tray_uuid: '{{ tray_uuid }}'
              filament_used_weight: '{{ tray_weight }}'
              filament_color: '{{ color }}'
              filament_active_tray_id: '{{ tray_sensor }}'
        default:
        - action: system_log.write
          data:
            message: 'SPOOLMANSYNC OFFLINE FLUSH (skipped) | Tray: {{ tray_composite
              }} | Weight: {{ tray_weight }}g | Reason: {{ ''no tray in helper'' if
              tray_composite < 0 else ''no weight'' if tray_weight < 0.01 else ''tray
              sensor not found'' }}'
            level: '{{ ''warning'' if tray_weight >= 0.01 else ''info'' }}'
      - action: utility_meter.calibrate
        target:
          entity_id: sensor.spoolmansync_20p5aj661102691_filament_usage_meter
        data:
          value: '0'
      - action: system_log.write
        data:
          message: SPOOLMANSYNC METER RESET (printer offline) | 20p5aj661102691
          level: info
  mode: single
- id: spoolmansync_tray_change_20p5aj661102691
  alias: SpoolmanSync - Tray Change (20p5aj661102691)
  description: Detect physical spool changes and auto-assign/unassign in Spoolman
  triggers:
  - entity_id:
    - sensor.x2d_20p5aj661102691_externalspool_external_spool
    - sensor.x2d_20p5aj661102691_externalspool2_external_spool
    - sensor.x2d_20p5aj661102691_ams_1_tray_1
    - sensor.x2d_20p5aj661102691_ams_1_tray_2
    - sensor.x2d_20p5aj661102691_ams_1_tray_3
    - sensor.x2d_20p5aj661102691_ams_1_tray_4
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not
      in [''unavailable'', ''unknown''] }}'
  - condition: template
    value_template: "{{ trigger.from_state is none or trigger.to_state is none or\n\
      \   trigger.to_state.attributes.get('tray_uuid', '') != trigger.from_state.attributes.get('tray_uuid',\
      \ '') or\n   trigger.to_state.attributes.get('name', '') != trigger.from_state.attributes.get('name',\
      \ '') }}"
  variables:
    tray_entity_id: '{{ trigger.entity_id }}'
    tray_uuid: '{{ state_attr(trigger.entity_id, ''tray_uuid'') | default('''') }}'
    name: '{{ state_attr(trigger.entity_id, ''name'') | default('''') }}'
    material: '{{ state_attr(trigger.entity_id, ''type'') | default('''') }}'
    color: '{{ state_attr(trigger.entity_id, ''color'') | default('''') }}'
  actions:
  - action: system_log.write
    data:
      message: 'SPOOLMANSYNC TRAY CHANGE DETECTED | {{ tray_entity_id }} | Name: {{
        name }} | Material: {{ material }} | Spool Serial: {{ tray_uuid }} | Color:
        {{ color }}'
      level: info
  - action: rest_command.spoolmansync_tray_change
    data:
      tray_entity_id: '{{ tray_entity_id }}'
      tray_uuid: '{{ tray_uuid }}'
      name: '{{ name }}'
      material: '{{ material }}'
      color: '{{ color }}'
      current_print_state: '{{ states(''sensor.x2d_20p5aj661102691_current_stage'')
        }}'
  mode: queued
  max: 10
