        %}{% if states(''sensor.backup_backup_manager_state'') in [''failed'',''error'',''unknown'',''unavailable'']
        %}{{ (as_timestamp(now())-as_timestamp(states.sensor.backup_backup_manager_state.last_changed,0))/60
        }}{% elif backup_age_hours < 0 %}{{ (as_timestamp(now())-as_timestamp(states.sensor.backup_last_successful_automatic_backup.last_changed,0))/60
        }}{% else %}{{ [backup_age_hours*60-2880,0]|max }}{% endif %}'
