- id: '1795110810097'
  alias: FlowLedger alerts
  description: Receives FlowLedger alert events (webhook) and shows them as notifications.
  triggers:
  - trigger: webhook
    webhook_id: !secret 'automations_33_triggers_0_webhook_id'
