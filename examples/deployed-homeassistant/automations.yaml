      0) }}'
  actions:
  - action: script.homeops_send_jd
    data:
      title: Home Operations daily digest
      message: "Home Operations daily digest.\n{% set issues = namespace(items=[])\
        \ %}\n{% for eid,label in {\n 'input_boolean.homeops_health_front_door_unavailable':'Front\
        \ door monitoring unavailable',\n 'input_boolean.homeops_health_garage_unavailable':'Garage\
        \ monitoring unavailable',\n 'input_boolean.homeops_health_jd_location_stale':'JD\
        \ location stale',\n 'input_boolean.homeops_health_sam_location_stale':'Sam\
        \ location stale',\n 'input_boolean.homeops_health_backup_stale':'Backup stale',\n\
        \ 'input_boolean.homeops_health_disk_pressure':'Home Assistant disk pressure/monitoring\
        \ issue'}.items() %}{% if is_state(eid,'on') %}{% set issues.items=issues.items+[label]\
        \ %}{% endif %}{% endfor %}\n{% for eid,label in {\n 'sensor.front_door_deadbolt_battery_level':'Front\
        \ deadbolt',\n 'sensor.jd_s23_ultra_battery_level':'JD phone',\n 'sensor.samsung_s23_ultra_battery_level':'Sam\
        \ phone'}.items() %}{% set v=states(eid) %}{% if state_attr(eid,'unit_of_measurement')\
        \ != '%' or not is_number(v) or v|float < 0 or v|float > 100 %}{% set issues.items=issues.items+[label~'\
        \ battery data unavailable/invalid'] %}{% elif v|float <= 20 %}{% set issues.items=issues.items+[label~'\
        \ battery low ('~(v|float|round(0))~'%)'] %}{% endif %}{% endfor %}\n{% if\
        \ issues.items|length %}{{ issues.items|join('; ') }}.{% else %}No selected\
        \ maintenance issues.{% endif %}\nLast successful backup: {{ states('sensor.backup_last_successful_automatic_backup')\
        \ }}. Backup manager: {{ states('sensor.backup_backup_manager_state') }}.\
        \ Disk used: {{ states('sensor.system_monitor_disk_usage_config') }}%."
      tag: homeops-daily-digest
      dry_run: false
    continue_on_error: true
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.homeops_health_include_sam
        state: 'on'
      sequence:
      - action: script.homeops_send_sam
        data:
