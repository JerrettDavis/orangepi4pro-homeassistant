        states[''device_tracker.jd_s23_ultra''].last_reported|float(0)) %}{% if reported
        <= 0 %}{% set reported = as_timestamp(states[''device_tracker.jd_s23_ultra''].last_updated,
        states[''device_tracker.jd_s23_ultra''].last_updated|float(0)) %}{% endif
        %}{% set age = as_timestamp(now()) - reported %}{{ state_attr(''person.jd'',''source'')
        == ''device_tracker.jd_s23_ultra'' and tracker_state not in [''unknown'',''unavailable'',''none'','''']
        and reported > 0 and 0 <= age <= (states(''input_number.homeops_phone_freshness_minutes'')|float(120))*60
        }}'
      sam_fresh: '{% set tracker_state = states(''device_tracker.sam_s_s23_ultra_2'')
