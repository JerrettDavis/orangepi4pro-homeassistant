- id: homeops_presence_jd_to_sam
  alias: HomeOps Presence JD to SAM
  description: Reciprocal named-zone notification with editable debounce and quiet
    hours.
  triggers:
  - trigger: state
    entity_id: person.jd
    to: null
    id: transition
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id: device_tracker.jd_s23_ultra
    from: unknown
    id: source_recovered_unknown
  - trigger: state
    entity_id: device_tracker.jd_s23_ultra
    from: unavailable
    id: source_recovered_unavailable
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: startup
      sequence:
      - delay:
          minutes: '{{ states(''input_number.homeops_availability_grace_minutes'')|int(5)
            }}'
      - condition: template
        value_template: '{{ state_attr(''person.jd'',''source'') == ''device_tracker.jd_s23_ultra''
          and states(''device_tracker.jd_s23_ultra'') not in [''unknown'',''unavailable'']
          }}'
      - condition: template
        value_template: '{{ states(''person.jd'') not in [''unknown'',''unavailable'']
          }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.homeops_presence_jd_committed_zone
        data:
          value: '{{ states(''person.jd'') }}'
      - stop: Presence committed zone seeded after startup
    - conditions:
      - condition: trigger
        id:
        - source_recovered_unknown
        - source_recovered_unavailable
      sequence:
      - delay:
          seconds: '{{ states(''input_number.homeops_presence_debounce_seconds'')|int(30)
            }}'
      - condition: template
        value_template: '{{ state_attr(''person.jd'',''source'') == ''device_tracker.jd_s23_ultra''
          and states(''device_tracker.jd_s23_ultra'') not in [''unknown'',''unavailable'']
          }}'
      - condition: template
        value_template: '{{ states(''person.jd'') not in [''unknown'',''unavailable'']
          }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.homeops_presence_jd_committed_zone
        data:
          value: '{{ states(''person.jd'') }}'
      - stop: Presence committed zone reseeded after source recovery
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not
      in [''unknown'',''unavailable''] and (trigger.from_state is none or trigger.from_state.state
      in [''unknown'',''unavailable''] or trigger.from_state.state != trigger.to_state.state)
      }}'
  - variables:
      from_state: '{{ trigger.from_state.state if trigger.from_state is not none else
        ''unknown'' }}'
      to_state: '{{ trigger.to_state.state }}'
      to_changed: '{{ trigger.to_state.last_changed.isoformat() }}'
      zone_labels:
        home: home
        JD's Job: JD's work
        Sam's Job: Sam's work
        Daycare: daycare
        Maya Alt Daycare: alternate daycare
        Maya's School: school
      recovery_seed: '{{ trigger.from_state is none or trigger.from_state.state in
        [''unknown'',''unavailable''] }}'
  - delay:
      seconds: '{{ states(''input_number.homeops_presence_debounce_seconds'') | int(30)
        }}'
  - condition: template
    value_template: '{{ state_attr(''person.jd'',''source'') == ''device_tracker.jd_s23_ultra''
      and states(''device_tracker.jd_s23_ultra'') not in [''unknown'',''unavailable'']
      }}'
  - condition: template
    value_template: '{{ states[''person.jd''].last_changed.isoformat() == to_changed
      and states(''person.jd'') == to_state }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ recovery_seed }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.homeops_presence_jd_committed_zone
        data:
          value: '{{ to_state }}'
      - stop: Presence committed zone reseeded after restored person state
  - variables:
      committed_state: '{{ states(''input_text.homeops_presence_jd_committed_zone'')
        }}'
      enabled_now: '{{ is_state(''input_boolean.homeops_presence_alerts_enabled'',''on'')
        }}'
      snoozed_now: '{{ as_timestamp(now()) < as_timestamp(states(''input_datetime.homeops_snooze_until''),
        0) }}'
      not_quiet_now: '{% set sr=states(''input_datetime.homeops_presence_quiet_start'')
        %}{% set er=states(''input_datetime.homeops_presence_quiet_end'') %}{% set
        s=(sr if '':'' in sr else ''22:00:00'').split('':'') %}{% set e=(er if '':''
        in er else ''07:00:00'').split('':'') %}{% set n=now().hour*60+now().minute
        %}{% set sm=s[0]|int(22)*60+s[1]|int(0) %}{% set em=e[0]|int(7)*60+e[1]|int(0)
        %}{{ not ((sm <= n < em) if sm < em else (n >= sm or n < em)) }}'
  - variables:
      presence_decision: '{%- if committed_state in ['''', ''unknown'', ''unavailable'',
        ''none''] -%}seed

        {%- elif committed_state == to_state -%}none

        {%- else -%}commit

        {%- endif -%}'
      notify_allowed: '{{ enabled_now and not snoozed_now and not_quiet_now }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ presence_decision == ''seed'' }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.homeops_presence_jd_committed_zone
        data:
          value: '{{ to_state }}'
      - stop: Presence committed zone seeded without notification
    - conditions:
      - condition: template
        value_template: '{{ presence_decision == ''none'' }}'
      sequence:
      - stop: Presence returned to committed zone; bounce suppressed
  - if:
    - condition: template
      value_template: '{{ notify_allowed and committed_state in zone_labels and committed_state
        != to_state }}'
    then:
    - action: script.homeops_send_sam
      data:
        title: JD location
        message: '{{ ''JD has left '' ~ zone_labels[committed_state] ~ ''.'' }}'
        tag: homeops-presence-jd-{{ committed_state|lower|replace(' ','-') }}-leave
        dry_run: false
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ notify_allowed and to_state in zone_labels and committed_state
        != to_state }}'
    then:
    - action: script.homeops_send_sam
      data:
        title: JD location
        message: '{{ ''JD has arrived at '' ~ zone_labels[to_state] ~ ''.'' }}'
        tag: homeops-presence-jd-{{ to_state|lower|replace(' ','-') }}-enter
        dry_run: false
      continue_on_error: true
  - action: input_text.set_value
    target:
      entity_id: input_text.homeops_presence_jd_committed_zone
    data:
      value: '{{ to_state }}'
  mode: restart
