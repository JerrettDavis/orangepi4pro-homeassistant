- id: '1786128000000'
  alias: Internet outage and recovery notifications
  description: Requires both the external Cloudflare probe and OPNsense WAN monitor
    to agree, with debounce periods for outage and recovery.
  triggers:
  - trigger: template
    value_template: '{{ is_state(''binary_sensor.1_1_1_1'', ''off'') and states(''sensor.jdh_gateway_00_gateway_wan_dhcp_status'')
      != ''online'' }}'
    for: 00:02:00
    id: outage
  - trigger: template
    value_template: '{{ is_state(''binary_sensor.1_1_1_1'', ''on'') and is_state(''sensor.jdh_gateway_00_gateway_wan_dhcp_status'',
      ''online'') }}'
    for: 00:01:00
    id: recovery
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - outage
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: internet_outage
          title: Internet outage
          message: Internet connectivity is down. Both the external probe and OPNsense
            WAN monitor have failed for two minutes.
      - action: notify.mobile_app_jd_s23_ultra
        data:
          title: JDH Internet Down
          message: Internet connectivity is down. Both external and gateway checks
            have failed for two minutes.
      - action: notify.mobile_app_samsung_s23_ultra
        data:
          title: JDH Internet Down
          message: Internet connectivity is down. Both external and gateway checks
            have failed for two minutes.
    - conditions:
      - condition: trigger
        id:
        - recovery
      sequence:
      - action: notify.mobile_app_jd_s23_ultra
        data:
          title: JDH Internet Restored
          message: Internet connectivity is back up. Both external and gateway checks
            have been healthy for one minute.
      - action: notify.mobile_app_samsung_s23_ultra
        data:
          title: JDH Internet Restored
          message: Internet connectivity is back up. Both external and gateway checks
            have been healthy for one minute.
      - action: persistent_notification.dismiss
        data:
          notification_id: internet_outage
  mode: single
- id: housecat_publish_home_snapshot
  alias: House Cat - Publish home snapshot
  description: Publishes live JDH weather and Hallway readings to the House Cat panel.
  triggers:
  - trigger: time_pattern
    minutes: /5
  - trigger: state
    entity_id:
    - weather.forecast_jdh_ha
    - sensor.hallway_temperature
    - sensor.hallway_humidity
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ is_number(state_attr(''weather.forecast_jdh_ha'', ''temperature''))
      and is_number(states(''sensor.hallway_temperature'')) and is_number(states(''sensor.hallway_humidity''))
      }}'
  actions:
  - action: mqtt.publish
    data:
      topic: housecat/housecat-desk-01/command/home
      retain: true
      payload: "{% set outside = state_attr('weather.forecast_jdh_ha', 'temperature')\
        \ | float %}\n{% set unit = state_attr('weather.forecast_jdh_ha', 'temperature_unit')\
        \ %}\n{% set outside_f = (outside * 9 / 5 + 32) if unit in ['°C', 'C'] else\
        \ outside %}\n{% set inside_f = states('sensor.hallway_temperature') | float\
        \ %}\n{% set inside_humidity = states('sensor.hallway_humidity') | float %}\n\
        {% set hour = now().hour %}\n{% if hour < 6 %}\n  {% set pal_message = 'Still\
        \ nighttime. Cozy paws.' %}\n{% elif hour < 12 %}\n  {% set pal_message =\
        \ 'Good morning! Home feels comfy.' %}\n{% elif outside_f >= 90 %}\n  {% set\
        \ pal_message = 'Hot outside. Stay cool, pal.' %}\n{% elif inside_humidity\
        \ >= 60 %}\n  {% set pal_message = 'A little muggy inside today.' %}\n{% elif\
        \ hour < 18 %}\n  {% set pal_message = 'Everything looks comfy.' %}\n{% elif\
        \ hour < 22 %}\n  {% set pal_message = 'Good evening! Home feels cozy.' %}\n\
        {% else %}\n  {% set pal_message = 'Good night. Cozy paws.' %}\n{% endif %}\n\
        {{ {\n  'outside_f': outside_f | round(1),\n  'inside_f': inside_f,\n  'condition':\
        \ states('weather.forecast_jdh_ha'),\n  'condition_label': states('weather.forecast_jdh_ha')\
        \ | replace('_', ' ') | title,\n  'pal_label': 'PAL',\n  'pal_message': pal_message,\n\
        \  'epoch_s': now().timestamp() | int,\n  'weather_entity': 'weather.forecast_jdh_ha',\n\
        \  'observed_at': now().isoformat(),\n  'rooms': [{\n    'name': 'Hallway',\n\
        \    'temperature_f': states('sensor.hallway_temperature') | float,\n    'humidity':\
        \ states('sensor.hallway_humidity') | float\n  }]\n} | to_json }}"
  mode: restart
- id: housecat_bedtime_reminder
  alias: House Cat - Bedtime reminder
  description: Reminds the panel when neither House Cat nor available Samsung Health
    data reports sleep.
  triggers:
  - trigger: time
    at: 01:00:00
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.house_cat_activity'') != ''sleep'' }}'
  - condition: template
    value_template: '{{ not (false) }}'
  actions:
  - action: mqtt.publish
    data:
      topic: housecat/housecat-desk-01/command/notification
      payload: '{{ {''id'':''bedtime-reminder'',''title'':''Bedtime, pal'',''body'':''You
        have not started sleep yet. Wind down together?'',''kind'':''warning'',''priority'':''important'',''ttl_s'':7200,''ack'':false}
        | to_json }}'
  mode: single
- id: housecat_focus_phase_changed
  alias: House Cat - Focus phase changed
  description: Shows a gentle panel notification when the 25/5 work phase changes.
  triggers:
  - trigger: state
    entity_id: sensor.house_cat_focus_phase
    from: focus
    to: break
  - trigger: state
    entity_id: sensor.house_cat_focus_phase
    from: break
    to: focus
  actions:
  - action: mqtt.publish
    data:
      topic: housecat/housecat-desk-01/command/notification
      payload: '{{ {''id'':''focus-phase-'' ~ now().timestamp()|int,''title'':(''Break
        time'' if trigger.to_state.state == ''break'' else ''Focus time''),''body'':(''Stretch
        and reset for five minutes.'' if trigger.to_state.state == ''break'' else
        ''Ready for another focused block?''),''kind'':''mission'',''priority'':''notice'',''ttl_s'':600,''ack'':false}
        | to_json }}'
  mode: restart
- id: lease_refresh_history
  alias: Lease - Refresh weighted driving baselines
  description: Refresh weighted driving baselines and reconcile calendar-month mileage
    from recorded odometers daily and after startup.
  triggers:
  - trigger: time
    at: 00:15:00
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: recorder.get_statistics
    data:
      start_time: '{{ (today_at(''00:00'')-timedelta(days=30,hours=1)).isoformat()
        }}'
      end_time: '{{ (today_at(''00:00'')-timedelta(days=30)).isoformat() }}'
      statistic_ids:
      - sensor.2025_ioniq_5_n_odometer
      - sensor.dodge_charger_odometer
      period: hour
      types:
      - state
    response_variable: history
  - if:
    - condition: template
      value_template: '{{ history.statistics.get(''sensor.2025_ioniq_5_n_odometer'',
        [])|length > 0 and is_number((history.statistics.get(''sensor.2025_ioniq_5_n_odometer'',
        []))[0].get(''state'')) }}'
    then:
    - action: input_number.set_value
      data:
        entity_id: input_number.lease_ioniq_rolling_baseline
        value: '{{ (history.statistics.get(''sensor.2025_ioniq_5_n_odometer'', []))[0].state
          }}'
    - action: input_datetime.set_datetime
      data:
        entity_id: input_datetime.lease_ioniq_rolling_baseline_at
        timestamp: '{{ as_timestamp((history.statistics.get(''sensor.2025_ioniq_5_n_odometer'',
          []))[0].end) }}'
  - if:
    - condition: template
      value_template: '{{ history.statistics.get(''sensor.dodge_charger_odometer'',
        [])|length > 0 and is_number((history.statistics.get(''sensor.dodge_charger_odometer'',
        []))[0].get(''state'')) }}'
    then:
    - action: input_number.set_value
      data:
        entity_id: input_number.lease_charger_rolling_baseline
        value: '{{ (history.statistics.get(''sensor.dodge_charger_odometer'', []))[0].state
          }}'
    - action: input_datetime.set_datetime
      data:
        entity_id: input_datetime.lease_charger_rolling_baseline_at
        timestamp: '{{ as_timestamp((history.statistics.get(''sensor.dodge_charger_odometer'',
          []))[0].end) }}'
  - action: recorder.get_statistics
    data:
      start_time: '{{ (today_at(''00:00'')-timedelta(days=7,hours=1)).isoformat()
        }}'
      end_time: '{{ (today_at(''00:00'')-timedelta(days=7)).isoformat() }}'
      statistic_ids:
      - sensor.2025_ioniq_5_n_odometer
      - sensor.dodge_charger_odometer
      period: hour
      types:
      - state
    response_variable: weekly
  - if:
    - condition: template
      value_template: '{{ weekly.statistics.get(''sensor.2025_ioniq_5_n_odometer'',[])|length>0
        and is_number((weekly.statistics.get(''sensor.2025_ioniq_5_n_odometer'',[]))[0].get(''state''))
        }}'
    then:
    - action: input_number.set_value
      data:
        entity_id: input_number.lease_ioniq_weekly_baseline
        value: '{{ (weekly.statistics.get(''sensor.2025_ioniq_5_n_odometer'',[]))[0].state
          }}'
    - action: input_datetime.set_datetime
      data:
        entity_id: input_datetime.lease_ioniq_weekly_baseline_at
        timestamp: '{{ as_timestamp((weekly.statistics.get(''sensor.2025_ioniq_5_n_odometer'',[]))[0].end)
          }}'
  - if:
    - condition: template
      value_template: '{{ weekly.statistics.get(''sensor.dodge_charger_odometer'',[])|length>0
        and is_number((weekly.statistics.get(''sensor.dodge_charger_odometer'',[]))[0].get(''state''))
        }}'
    then:
    - action: input_number.set_value
      data:
        entity_id: input_number.lease_charger_weekly_baseline
        value: '{{ (weekly.statistics.get(''sensor.dodge_charger_odometer'',[]))[0].state
          }}'
    - action: input_datetime.set_datetime
      data:
        entity_id: input_datetime.lease_charger_weekly_baseline_at
        timestamp: '{{ as_timestamp((weekly.statistics.get(''sensor.dodge_charger_odometer'',[]))[0].end)
          }}'
  - action: recorder.get_statistics
    data:
      start_time: '{{ (today_at(''00:00'').replace(day=1)-timedelta(hours=1)).isoformat()
        }}'
      end_time: '{{ today_at(''00:00'').replace(day=1).isoformat() }}'
      statistic_ids:
      - sensor.2025_ioniq_5_n_odometer
      - sensor.dodge_charger_odometer
      period: hour
      types:
      - state
    response_variable: month
  - if:
    - condition: template
      value_template: '{{ month.statistics.get(''sensor.2025_ioniq_5_n_odometer'',[])|length>0
        and is_number((month.statistics.get(''sensor.2025_ioniq_5_n_odometer'',[]))[0].get(''state''))
        and is_number(states(''sensor.2025_ioniq_5_n_odometer'')) and states(''sensor.2025_ioniq_5_n_odometer'')|float(0)
        >= (month.statistics.get(''sensor.2025_ioniq_5_n_odometer'',[]))[0].state|float(0)
        }}'
    then:
    - action: utility_meter.calibrate
      data:
        entity_id: sensor.lease_ioniq_monthly_miles
        value: '{{ (states(''sensor.2025_ioniq_5_n_odometer'')|float - (month.statistics.get(''sensor.2025_ioniq_5_n_odometer'',[]))[0].state|float)|round(3)
          }}'
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.lease_ioniq_month_complete
    else:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.lease_ioniq_month_complete
  - if:
    - condition: template
      value_template: '{{ month.statistics.get(''sensor.dodge_charger_odometer'',[])|length>0
        and is_number((month.statistics.get(''sensor.dodge_charger_odometer'',[]))[0].get(''state''))
        and is_number(states(''sensor.dodge_charger_odometer'')) and states(''sensor.dodge_charger_odometer'')|float(0)
        >= (month.statistics.get(''sensor.dodge_charger_odometer'',[]))[0].state|float(0)
        }}'
    then:
    - action: utility_meter.calibrate
      data:
        entity_id: sensor.lease_charger_monthly_miles
        value: '{{ (states(''sensor.dodge_charger_odometer'')|float - (month.statistics.get(''sensor.dodge_charger_odometer'',[]))[0].state|float)|round(3)
          }}'
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.lease_charger_month_complete
    else:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.lease_charger_month_complete
  mode: single
- id: lease_mileage_warning
  alias: Lease - Mileage budget warning to JD and Sam
  description: At most once daily, 08:00-21:00 local. Warns on monthly limit, ahead-of-month
    pace, or projected lease overage.
  triggers:
  - trigger: time
    at: '18:00:00'
  - trigger: state
    entity_id:
    - binary_sensor.lease_ioniq_monthly_over_budget
    - binary_sensor.lease_charger_monthly_over_budget
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.lease_notifications_enabled
    state: 'on'
  - condition: time
    after: 08:00:00
    before: '21:00:00'
  - condition: template
    value_template: '{{ (is_number(states(''sensor.lease_ioniq_monthly_miles'')) and
      (states(''sensor.lease_ioniq_monthly_miles'')|float(0)>states(''sensor.lease_ioniq_monthly_allowance'')|float(0)
      or states(''sensor.lease_ioniq_month_pace_delta'')|float(0)>states(''input_number.lease_warning_pace_miles'')|float(100)))
      or (is_number(states(''sensor.lease_charger_monthly_miles'')) and (states(''sensor.lease_charger_monthly_miles'')|float(0)>states(''sensor.lease_charger_monthly_allowance'')|float(0)
      or states(''sensor.lease_charger_month_pace_delta'')|float(0)>states(''input_number.lease_warning_pace_miles'')|float(100)))
      or states(''sensor.lease_ioniq_projected_overage'')|float(0)>100 or states(''sensor.lease_charger_projected_overage'')|float(0)>100
      }}'
  - condition: template
    value_template: '{{ states(''input_datetime.lease_last_warning'')[:10] != now().strftime(''%Y-%m-%d'')
      }}'
  actions:
  - action: notify.mobile_app_jd_s23_ultra
    data:
      title: Vehicle mileage warning
      message: '{% for car,name in [(''ioniq'',''Ioniq''),(''charger'',''Charger'')]
        %}

        {% if is_number(states(''sensor.lease_''~car~''_monthly_miles'')) and is_number(states(''sensor.lease_''~car~''_current_budget_overage''))
        %}

        {{ name }}: {{ states(''sensor.lease_''~car~''_monthly_miles'')|float(0)|round(0)
        }} / {{ states(''sensor.lease_''~car~''_monthly_allowance'')|float(0)|round(0)
        }} mi this month.

        Budget overage today: {{ states(''sensor.lease_''~car~''_current_budget_overage'')|float(0)|round(0)
        }} mi (${{ states(''sensor.lease_''~car~''_current_budget_cost'') }} at ${{
        states(''input_number.lease_''~car~''_excess_rate'') }}/mi).

        {% if is_number(states(''sensor.lease_''~car~''_projected_overage'')) %}At
        weighted pace: {{ states(''sensor.lease_''~car~''_projected_overage'')|float(0)|round(0)
        }} mi over at lease end.{% else %}Projection waiting for valid history.{%
        endif %}

