- id: homeops_health_disk
  alias: HomeOps Health Disk Pressure
  description: 'Selected /config disk metric: warn at editable threshold after grace;
    recover below editable hysteresis threshold.'
  triggers:
  - trigger: state
    entity_id: sensor.system_monitor_disk_usage_config
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time_pattern
    minutes: /5
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: startup
      sequence:
      - delay:
          minutes: '{{ states(''input_number.homeops_availability_grace_minutes'')|int(5)
            }}'
  - variables:
      enabled: '{{ is_state(''input_boolean.homeops_health_alerts_enabled'',''on'')
        }}'
      snoozed: '{{ as_timestamp(now()) < as_timestamp(states(''input_datetime.homeops_snooze_until''),
        0) }}'
      value_valid: '{{ is_number(states(''sensor.system_monitor_disk_usage_config''))
        and 0 <= states(''sensor.system_monitor_disk_usage_config'')|float <= 100
        }}'
      value: '{{ states(''sensor.system_monitor_disk_usage_config'')|float(0) }}'
      active: '{{ is_state(''input_boolean.homeops_health_disk_pressure'',''on'')
        }}'
      warning: '{{ states(''input_number.homeops_disk_warning_percent'')|float(85)
        }}'
      recovery: '{% set warning=states(''input_number.homeops_disk_warning_percent'')|float(85)
        %}{{ [states(''input_number.homeops_disk_recovery_percent'')|float(80), warning-1]|min
        }}'
      age: '{{ (as_timestamp(now())-as_timestamp(states(''input_datetime.homeops_health_disk_pressure_since''),as_timestamp(now())))/60
        }}'
      grace: '{{ states(''input_number.homeops_availability_grace_minutes'')|float(5)
        }}'
      since_set: '{{ states(''input_datetime.homeops_health_disk_pressure_since'')
        not in [''unknown'',''unavailable'',''none'',''''] and states(''input_datetime.homeops_health_disk_pressure_since'')[:10]
        != ''2000-01-01'' }}'
  - variables:
      decision: '{% if active and value_valid and value < recovery %}recover{% elif
        not enabled or snoozed %}none{% elif (not value_valid or value >= warning)
        and not active and not since_set %}start{% elif (not value_valid or value
        >= warning) and not active and age >= grace %}open{% elif active %}none{%
        else %}reset{% endif %}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ decision == ''start'' }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.homeops_health_disk_pressure_since
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - conditions:
      - condition: template
        value_template: '{{ decision == ''reset'' }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.homeops_health_disk_pressure_since
        data:
          datetime: '2000-01-01 00:00:00'
    - conditions:
      - condition: template
        value_template: '{{ decision == ''open'' }}'
      sequence:
      - action: script.homeops_send_jd
        data:
          title: Home Assistant disk warning
          message: 'Disk use is {{ states(''sensor.system_monitor_disk_usage_config'')
            }}% (warning {{ warning }}%), or the live metric is invalid. Free: {{
            states(''sensor.system_monitor_disk_free_config'') }} GiB.'
          tag: homeops-health-disk
          dry_run: false
        continue_on_error: true
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.homeops_health_include_sam
            state: 'on'
          sequence:
          - action: script.homeops_send_sam
            data:
              title: Home Assistant disk warning
              message: 'Disk use is {{ states(''sensor.system_monitor_disk_usage_config'')
                }}% (warning {{ warning }}%), or the live metric is invalid. Free:
                {{ states(''sensor.system_monitor_disk_free_config'') }} GiB.'
              tag: homeops-health-disk
              dry_run: false
            continue_on_error: true
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.homeops_health_disk_pressure
    - conditions:
      - condition: template
        value_template: '{{ decision == ''recover'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ not snoozed }}'
          sequence:
          - action: script.homeops_send_jd
            data:
              title: Home Assistant disk recovered
              message: Disk use is {{ value }}%, below the {{ recovery }}% recovery
                threshold.
              tag: homeops-health-disk
              dry_run: false
            continue_on_error: true
          - choose:
            - conditions:
              - condition: state
                entity_id: input_boolean.homeops_health_include_sam
                state: 'on'
              sequence:
              - action: script.homeops_send_sam
                data:
                  title: Home Assistant disk recovered
                  message: Disk use is {{ value }}%, below the {{ recovery }}% recovery
                    threshold.
                  tag: homeops-health-disk
                  dry_run: false
                continue_on_error: true
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.homeops_health_disk_pressure
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.homeops_health_disk_pressure_since
        data:
          datetime: '2000-01-01 00:00:00'
  mode: queued
  max: 5
