        0) }}'
      available: '{% set backup_age_hours=(as_timestamp(now())-as_timestamp(states(''sensor.backup_last_successful_automatic_backup''),0))/3600
        %}{{ states(''sensor.backup_backup_manager_state'') not in [''failed'',''error'',''unknown'',''unavailable'']
        and 0 <= backup_age_hours <= 48 }}'
