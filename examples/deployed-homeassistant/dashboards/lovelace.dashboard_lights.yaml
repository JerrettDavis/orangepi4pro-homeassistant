          ''light.kitchen_lights'', ''light.dining_room_light'', ''light.desk_lights'',
          ''light.office_hexa'', ''light.bedroom_ceiling_fan'', ''light.jd_bed_light'',
          ''light.sam_bed_light'', ''light.maya_lamp'', ''light.back_string_lights'',
          ''light.driveway_cam_floodlight'', ''light.garage_door_light'', ''light.baby_cam_floodlight'',
