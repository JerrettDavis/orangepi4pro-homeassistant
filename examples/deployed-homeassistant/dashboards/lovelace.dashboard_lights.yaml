  - type: sections
    title: Device map
    path: device-map
    icon: mdi:sitemap
    max_columns: 3
    sections:
    - type: grid
      cards:
      - type: heading
        heading: How lights are organised
        heading_style: title
        icon: mdi:sitemap
      - type: markdown
        content: '**One tile per physical fixture.** Govee strips publish a cloud
          entity, a duplicate MQTT entity and one entity per LED segment. TP-Link,
          Tuya and SmartThings can all expose the same switch or bulb. Only the entity
          in *Entity shown* is used here, so nothing is controlled twice.


          **Wall switches that feed bulbs.** The HS200/HS220 wall controls power Govee
          bulbs. Turning the wall control off cuts power, and the bulbs then show
          as offline. Use the wall control for on/off and the bulb group for colour
          and brightness.'
      column_span: 3
    - type: grid
      cards:
      - type: markdown
        content: '| Fixture | Room | Controlled by | Entity shown | Now | Left out
          of dashboard |

          |---|---|---|---|---|---|

          | Living room ceiling bulbs ×4 | Living Room | HS220 wall dimmer → 4 Govee
          bulbs | `light.living_room_lights` | {{ ''🟢 on'' if is_state(''light.living_room_lights'',''on'')
          else ''⚪ off'' if is_state(''light.living_room_lights'',''off'') else ''🔴
          offline'' }} | light.living_room_lights_st (SmartThings copy of the dimmer)
          |

          | Fireplace bulb | Living Room | HS200 wall switch → Govee bulb | `light.fireplace_light`
          | {{ ''🟢 on'' if is_state(''light.fireplace_light'',''on'') else ''⚪ off''
          if is_state(''light.fireplace_light'',''off'') else ''🔴 offline'' }} | switch.fireplace_light_switch,
          switch.fireplace_light_st |

          | Entertainment center | Living Room | Cync dimmer | `light.entertainment_center_dimmer`
          | {{ ''🟢 on'' if is_state(''light.entertainment_center_dimmer'',''on'')
          else ''⚪ off'' if is_state(''light.entertainment_center_dimmer'',''off'')
          else ''🔴 offline'' }} | — |

          | TV backlight | Living Room | Govee strip | `light.tv_backlight` | {{ ''🟢
          on'' if is_state(''light.tv_backlight'',''on'') else ''⚪ off'' if is_state(''light.tv_backlight'',''off'')
          else ''🔴 offline'' }} | light.tv_backlight_2 + 15 segments |

          | TV floor lights | Living Room | Govee strip | `light.tv_floor_lights`
          | {{ ''🟢 on'' if is_state(''light.tv_floor_lights'',''on'') else ''⚪ off''
          if is_state(''light.tv_floor_lights'',''off'') else ''🔴 offline'' }} | light.tv_floor_lights_2
          + 15 segments |

          | Dining room light | Kitchen & Dining | HS200 wall switch | `light.dining_room_light`
          | {{ ''🟢 on'' if is_state(''light.dining_room_light'',''on'') else ''⚪ off''
          if is_state(''light.dining_room_light'',''off'') else ''🔴 offline'' }} |
          switch.dining_room_light_switch, switch.dining_room_light_st |

          | Kitchen lights | Kitchen & Dining | Cync | `light.kitchen_lights` | {{
          ''🟢 on'' if is_state(''light.kitchen_lights'',''on'') else ''⚪ off'' if
