config:
  title: Lights
  views:
  - type: sections
    title: Rooms
    path: rooms
    icon: mdi:lightbulb-group
    max_columns: 3
    sections:
    - type: grid
      cards:
      - type: heading
        heading: Lights
        heading_style: title
        icon: mdi:lightbulb-group
      - type: grid
        columns: 3
        square: false
        cards:
        - type: custom:mushroom-template-card
          primary: 'On'
          secondary: '{{ ([''light.living_room_lights'', ''light.fireplace_light'',
            ''light.entertainment_center_dimmer'', ''light.tv_backlight'', ''light.tv_floor_lights'',
            ''light.kitchen_lights'', ''light.dining_room_light'', ''light.desk_lights'',
            ''light.office_hexa'', ''light.bedroom_ceiling_fan'', ''light.jd_bed_light'',
            ''light.sam_bed_light'', ''light.maya_lamp'', ''light.back_string_lights'',
            ''light.driveway_cam_floodlight'', ''light.garage_door_light'', ''light.baby_cam_floodlight'',
            ''switch.yard_lights'', ''switch.pole_lights'', ''switch.inflatable_tree'']
            | select(''is_state'', ''on'') | list | count) }} of 20'
          icon: mdi:lightbulb-on
          icon_color: '{{ ''amber'' if ([''light.living_room_lights'', ''light.fireplace_light'',
            ''light.entertainment_center_dimmer'', ''light.tv_backlight'', ''light.tv_floor_lights'',
            ''light.kitchen_lights'', ''light.dining_room_light'', ''light.desk_lights'',
            ''light.office_hexa'', ''light.bedroom_ceiling_fan'', ''light.jd_bed_light'',
            ''light.sam_bed_light'', ''light.maya_lamp'', ''light.back_string_lights'',
            ''light.driveway_cam_floodlight'', ''light.garage_door_light'', ''light.baby_cam_floodlight'',
            ''switch.yard_lights'', ''switch.pole_lights'', ''switch.inflatable_tree'']
            | select(''is_state'', ''on'') | list | count) > 0 else ''grey'' }}'
          tap_action:
            action: none
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
        - type: custom:mushroom-template-card
          primary: Offline
          secondary: '{{ ([''light.living_room_lights'', ''light.fireplace_light'',
            ''light.entertainment_center_dimmer'', ''light.tv_backlight'', ''light.tv_floor_lights'',
            ''light.kitchen_lights'', ''light.dining_room_light'', ''light.desk_lights'',
            ''light.office_hexa'', ''light.bedroom_ceiling_fan'', ''light.jd_bed_light'',
            ''light.sam_bed_light'', ''light.maya_lamp'', ''light.back_string_lights'',
            ''light.driveway_cam_floodlight'', ''light.garage_door_light'', ''light.baby_cam_floodlight'',
            ''switch.yard_lights'', ''switch.pole_lights'', ''switch.inflatable_tree'',
            ''light.kitchen_p2s_chamber_light'', ''light.x2d_20p5aj661102691_chamber_light'',
            ''light.v0_1_neopixel_bed'', ''light.v0_1_neopixel_caselight'', ''light.v0_1_neopixel_hotend_rgb'',
            ''light.living_room_air_filter'', ''light.office_air_purifier'', ''light.jdh_ap_00_led'',
            ''light.jdh_ap_01_led'', ''light.jdh_ap_02_led'', ''light.rfid_esp32_screen_status_led'']
            | select(''is_state'', [''unavailable'',''unknown'']) | list | count)
            }} of 31'
          icon: mdi:lightbulb-alert-outline
