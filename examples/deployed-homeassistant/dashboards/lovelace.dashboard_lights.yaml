          in off %}{{ state_attr(e,''friendly_name'') }}{{ '', '' if not loop.last
          }}{% endfor %}. Offline Govee entities usually mean the Govee-to-MQTT bridge,
          or the wall switch feeding the bulb, is off.{% else %}All fixtures are reporting.{%
          endif %}'
