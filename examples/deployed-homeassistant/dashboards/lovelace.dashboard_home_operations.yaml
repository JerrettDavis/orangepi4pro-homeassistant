config:
  title: Home Operations
  views:
  - type: sections
    title: Overview
    path: overview
    icon: mdi:home-heart
    max_columns: 3
    sections:
    - type: grid
      cards:
      - type: heading
        heading: Home Operations
        heading_style: title
        icon: mdi:home-heart
      - type: custom:mushroom-template-card
        primary: '{% if ([''input_boolean.homeops_security_front_door_active'', ''input_boolean.homeops_security_garage_active'',
          ''input_boolean.homeops_health_front_door_unavailable'', ''input_boolean.homeops_health_garage_unavailable'',
          ''input_boolean.homeops_health_jd_location_stale'', ''input_boolean.homeops_health_sam_location_stale'',
          ''input_boolean.homeops_health_backup_stale'', ''input_boolean.homeops_health_disk_pressure'']
          | select(''is_state'',''on'') | list | count) == 0 %}All clear{% else %}{{
          ([''input_boolean.homeops_security_front_door_active'', ''input_boolean.homeops_security_garage_active'',
          ''input_boolean.homeops_health_front_door_unavailable'', ''input_boolean.homeops_health_garage_unavailable'',
          ''input_boolean.homeops_health_jd_location_stale'', ''input_boolean.homeops_health_sam_location_stale'',
          ''input_boolean.homeops_health_backup_stale'', ''input_boolean.homeops_health_disk_pressure'']
          | select(''is_state'',''on'') | list | count) }} active issue{{ ''s'' if
          ([''input_boolean.homeops_security_front_door_active'', ''input_boolean.homeops_security_garage_active'',
          ''input_boolean.homeops_health_front_door_unavailable'', ''input_boolean.homeops_health_garage_unavailable'',
          ''input_boolean.homeops_health_jd_location_stale'', ''input_boolean.homeops_health_sam_location_stale'',
          ''input_boolean.homeops_health_backup_stale'', ''input_boolean.homeops_health_disk_pressure'']
          | select(''is_state'',''on'') | list | count) > 1 }}{% endif %}'
        secondary: '{% set sn = states(''input_datetime.homeops_snooze_until'') %}{%
          set snoozed = sn not in [''unknown'',''unavailable'',''none'',''''] and
          as_timestamp(sn, 0) > as_timestamp(now()) %}{% if snoozed %}Alerts snoozed
          until {{ as_local(as_datetime(sn)).strftime(''%-I:%M %p'') }}{% elif ([''input_boolean.homeops_security_front_door_active'',
          ''input_boolean.homeops_security_garage_active'', ''input_boolean.homeops_health_front_door_unavailable'',
          ''input_boolean.homeops_health_garage_unavailable'', ''input_boolean.homeops_health_jd_location_stale'',
          ''input_boolean.homeops_health_sam_location_stale'', ''input_boolean.homeops_health_backup_stale'',
          ''input_boolean.homeops_health_disk_pressure''] | select(''is_state'',''on'')
          | list | count) == 0 %}No security or monitoring incidents · alerts active{%
          else %}See Alerts for details{% endif %}'
        icon: '{{ ''mdi:shield-check'' if ([''input_boolean.homeops_security_front_door_active'',
          ''input_boolean.homeops_security_garage_active'', ''input_boolean.homeops_health_front_door_unavailable'',
          ''input_boolean.homeops_health_garage_unavailable'', ''input_boolean.homeops_health_jd_location_stale'',
          ''input_boolean.homeops_health_sam_location_stale'', ''input_boolean.homeops_health_backup_stale'',
          ''input_boolean.homeops_health_disk_pressure''] | select(''is_state'',''on'')
          | list | count) == 0 else ''mdi:shield-alert'' }}'
        icon_color: '{{ ''green'' if ([''input_boolean.homeops_security_front_door_active'',
          ''input_boolean.homeops_security_garage_active'', ''input_boolean.homeops_health_front_door_unavailable'',
          ''input_boolean.homeops_health_garage_unavailable'', ''input_boolean.homeops_health_jd_location_stale'',
          ''input_boolean.homeops_health_sam_location_stale'', ''input_boolean.homeops_health_backup_stale'',
          ''input_boolean.homeops_health_disk_pressure''] | select(''is_state'',''on'')
          | list | count) == 0 else ''red'' }}'
        tap_action:
          action: navigate
          navigation_path: /dashboard-home-operations/alerts
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        multiline_secondary: true
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
        - type: entity
          entity: input_boolean.homeops_presence_alerts_enabled
          icon: mdi:account-switch
          content_info: name
          name: Presence
        - type: entity
          entity: input_boolean.homeops_security_alerts_enabled
          icon: mdi:shield-lock
          content_info: name
          name: Security
        - type: entity
          entity: input_boolean.homeops_health_alerts_enabled
          icon: mdi:heart-pulse
          content_info: name
          name: Health
        - type: entity
          entity: input_boolean.homeops_digest_enabled
          icon: mdi:email-newsletter
          content_info: name
          name: Digest
        - type: template
          content: Snooze 1 h
          icon: mdi:bell-sleep-outline
          icon_color: blue
          tap_action:
            action: perform-action
            perform_action: script.turn_on
            target:
              entity_id: script.homeops_snooze_one_hour
        - type: template
          content: Resume
          icon: mdi:bell-ring-outline
          icon_color: green
          tap_action:
            action: perform-action
            perform_action: script.turn_on
            target:
              entity_id: script.homeops_resume_alerts
      column_span: 3
    - type: grid
      cards:
      - type: heading
        heading: People
        heading_style: title
        icon: mdi:account-multiple
      - type: custom:mushroom-template-card
        primary: JD
        secondary: '{{ states(''person.jd'') | replace(''_'','' '') | title }} · {%
          set src = states[''device_tracker.jd_s23_ultra''] %}{% set seen = src.last_reported
          | default(src.last_updated, true) %}{% set age = ((as_timestamp(now()) -
          as_timestamp(seen)) / 60) | round(0) %}{% set limit = states(''input_number.homeops_phone_freshness_minutes'')
          | float(120) %}{% if src.state in [''unknown'',''unavailable''] %}location
          unavailable{% elif age > limit %}stale · reported {{ relative_time(seen)
          }} ago{% else %}reported {{ relative_time(seen) }} ago{% endif %}'
        icon: mdi:account-circle
        icon_color: '{% set src = states[''device_tracker.jd_s23_ultra''] %}{% set
          seen = src.last_reported | default(src.last_updated, true) %}{% set age
          = ((as_timestamp(now()) - as_timestamp(seen)) / 60) | round(0) %}{{ ''red''
          if src.state in [''unknown'',''unavailable''] else ''orange'' if age > states(''input_number.homeops_phone_freshness_minutes'')
          | float(120) else ''green'' if is_state(''person.jd'',''home'') else ''blue''
          }}'
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        entity: person.jd
        picture: '{{ state_attr(''person.jd'',''entity_picture'') }}'
      - type: custom:mushroom-template-card
        primary: Sam
        secondary: '{{ states(''person.sam'') | replace(''_'','' '') | title }} ·
          {% set src = states[''device_tracker.sam_s_s23_ultra_2''] %}{% set seen
          = src.last_reported | default(src.last_updated, true) %}{% set age = ((as_timestamp(now())
          - as_timestamp(seen)) / 60) | round(0) %}{% set limit = states(''input_number.homeops_phone_freshness_minutes'')
          | float(120) %}{% if src.state in [''unknown'',''unavailable''] %}location
          unavailable{% elif age > limit %}stale · reported {{ relative_time(seen)
          }} ago{% else %}reported {{ relative_time(seen) }} ago{% endif %}'
        icon: mdi:account-circle
        icon_color: '{% set src = states[''device_tracker.sam_s_s23_ultra_2''] %}{%
          set seen = src.last_reported | default(src.last_updated, true) %}{% set
          age = ((as_timestamp(now()) - as_timestamp(seen)) / 60) | round(0) %}{{
          ''red'' if src.state in [''unknown'',''unavailable''] else ''orange'' if
          age > states(''input_number.homeops_phone_freshness_minutes'') | float(120)
          else ''green'' if is_state(''person.sam'',''home'') else ''blue'' }}'
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        entity: person.sam
        picture: '{{ state_attr(''person.sam'',''entity_picture'') }}'
      - type: markdown
        content: <sub>Confidence uses the phone's last report time, not when someone
          changed zones. Unknown, unavailable or stale location is never treated as
          confirmed away.</sub>
    - type: grid
      cards:
      - type: heading
        heading: Doors & garage
        heading_style: title
        icon: mdi:door
      - type: custom:mushroom-template-card
        primary: Front door
        secondary: '{% set s = states(''lock.front_door_deadbolt'') %}{% if s in [''locked'',''unlocked'']
          %}{{ s | title }} · updated {{ relative_time(states.lock.front_door_deadbolt.last_updated)
          }} ago{% elif s == ''jammed'' %}Jammed — security cannot be confirmed{%
          elif s in [''unknown'',''unavailable''] %}Unavailable — security cannot
          be confirmed{% else %}{{ s | replace(''_'','' '') | title }} — wait for
          a final state{% endif %}'
        icon: '{{ ''mdi:lock'' if is_state(''lock.front_door_deadbolt'',''locked'')
          else ''mdi:lock-open-alert'' }}'
        icon_color: '{{ ''green'' if is_state(''lock.front_door_deadbolt'',''locked'')
          else ''red'' }}'
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        entity: lock.front_door_deadbolt
        multiline_secondary: true
      - type: conditional
        conditions:
        - condition: state
          entity: lock.front_door_deadbolt
          state: unlocked
        card:
          type: custom:mushroom-template-card
          primary: Lock front door
          secondary: Tap to lock · asks to confirm
          icon: mdi:lock
          icon_color: green
          tap_action:
            action: perform-action
            perform_action: lock.lock
            target:
              entity_id: lock.front_door_deadbolt
            confirmation:
              text: Lock the front door now?
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
      - type: conditional
        conditions:
        - condition: state
          entity: lock.front_door_deadbolt
          state: locked
        card:
          type: custom:mushroom-template-card
          primary: Unlock front door
          secondary: Tap to unlock · asks to confirm
          icon: mdi:lock-open-variant
          icon_color: orange
          tap_action:
            action: perform-action
            perform_action: lock.unlock
            target:
              entity_id: lock.front_door_deadbolt
            confirmation:
              text: Unlock the front door now?
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
      - type: custom:mushroom-template-card
        primary: Garage door
        secondary: '{% set s = states(''cover.garage_door'') %}{% if s in [''open'',''opening'',''closed'',''closing'']
          %}{{ s | title }} · updated {{ relative_time(states.cover.garage_door.last_updated)
          }} ago{% elif s in [''unknown'',''unavailable''] %}Unavailable — security
          cannot be confirmed{% else %}{{ s | replace(''_'','' '') | title }}{% endif
          %}'
        icon: '{{ ''mdi:garage'' if is_state(''cover.garage_door'',''closed'') else
          ''mdi:garage-open'' }}'
        icon_color: '{{ ''green'' if is_state(''cover.garage_door'',''closed'') else
          ''orange'' }}'
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        entity: cover.garage_door
        multiline_secondary: true
      - type: conditional
        conditions:
        - condition: state
          entity: cover.garage_door
          state: open
        card:
          type: custom:mushroom-template-card
          primary: Close garage
          secondary: Tap to close · asks to confirm
          icon: mdi:garage
          icon_color: green
          tap_action:
            action: perform-action
            perform_action: cover.close_cover
            target:
              entity_id: cover.garage_door
            confirmation:
              text: Close the garage door now?
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
      - type: conditional
        conditions:
        - condition: state
          entity: cover.garage_door
          state: closed
        card:
          type: custom:mushroom-template-card
          primary: Open garage
          secondary: Tap to open · asks to confirm
          icon: mdi:garage-open
          icon_color: orange
          tap_action:
            action: perform-action
            perform_action: cover.open_cover
            target:
              entity_id: cover.garage_door
            confirmation:
              text: Open the garage door now?
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
      - type: markdown
        content: <sub>Controls move physical devices; each asks for confirmation.</sub>
    - type: grid
      cards:
      - type: heading
        heading: System health
        heading_style: title
        icon: mdi:heart-pulse
      - type: custom:mushroom-template-card
        primary: Backup
        secondary: '{% set l = states(''sensor.backup_last_successful_automatic_backup'')
          %}{% if l in [''unknown'',''unavailable''] %}No successful backup timestamp{%
          else %}Last success {{ relative_time(as_datetime(l)) }} ago{% endif %}'
        icon: mdi:backup-restore
        icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_health_backup_stale'',''on'')
          else ''green'' }}'
        tap_action:
          action: navigate
          navigation_path: /dashboard-home-operations/maintenance
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
      - type: custom:mushroom-template-card
        primary: Storage
        secondary: '{{ states(''sensor.system_monitor_disk_usage_config'') }}% used
          · {{ states(''sensor.system_monitor_disk_free_config'') }} GiB free'
        icon: mdi:harddisk
        icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_health_disk_pressure'',''on'')
          else ''green'' }}'
        tap_action:
          action: navigate
          navigation_path: /dashboard-home-operations/maintenance
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
      - type: custom:mushroom-template-card
        primary: Internet
        secondary: WAN {{ states('sensor.jdh_gateway_00_interface_wan_status') }}
          · {{ 'DNS reachable' if is_state('binary_sensor.1_1_1_1','on') else 'no
          reply from 1.1.1.1' }}
        icon: mdi:wan
        icon_color: '{{ ''green'' if is_state(''sensor.jdh_gateway_00_interface_wan_status'',''up'')
          and is_state(''binary_sensor.1_1_1_1'',''on'') else ''red'' }}'
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
  - type: sections
    title: Alerts
    path: alerts
    icon: mdi:alert-circle-outline
    max_columns: 3
    sections:
    - type: grid
      cards:
      - type: heading
        heading: Alerts
        heading_style: title
        icon: mdi:alert-circle-outline
      - type: custom:mushroom-template-card
        primary: '{% if ([''input_boolean.homeops_security_front_door_active'', ''input_boolean.homeops_security_garage_active'',
          ''input_boolean.homeops_health_front_door_unavailable'', ''input_boolean.homeops_health_garage_unavailable'',
          ''input_boolean.homeops_health_jd_location_stale'', ''input_boolean.homeops_health_sam_location_stale'',
          ''input_boolean.homeops_health_backup_stale'', ''input_boolean.homeops_health_disk_pressure'']
          | select(''is_state'',''on'') | list | count) == 0 %}All clear{% else %}{{
          ([''input_boolean.homeops_security_front_door_active'', ''input_boolean.homeops_security_garage_active'',
          ''input_boolean.homeops_health_front_door_unavailable'', ''input_boolean.homeops_health_garage_unavailable'',
          ''input_boolean.homeops_health_jd_location_stale'', ''input_boolean.homeops_health_sam_location_stale'',
          ''input_boolean.homeops_health_backup_stale'', ''input_boolean.homeops_health_disk_pressure'']
          | select(''is_state'',''on'') | list | count) }} active issue{{ ''s'' if
          ([''input_boolean.homeops_security_front_door_active'', ''input_boolean.homeops_security_garage_active'',
          ''input_boolean.homeops_health_front_door_unavailable'', ''input_boolean.homeops_health_garage_unavailable'',
          ''input_boolean.homeops_health_jd_location_stale'', ''input_boolean.homeops_health_sam_location_stale'',
          ''input_boolean.homeops_health_backup_stale'', ''input_boolean.homeops_health_disk_pressure'']
          | select(''is_state'',''on'') | list | count) > 1 }}{% endif %}'
        secondary: '{% set sn = states(''input_datetime.homeops_snooze_until'') %}{%
          set snoozed = sn not in [''unknown'',''unavailable'',''none'',''''] and
          as_timestamp(sn, 0) > as_timestamp(now()) %}{% if snoozed %}Alerts snoozed
          until {{ as_local(as_datetime(sn)).strftime(''%-I:%M %p'') }}{% elif ([''input_boolean.homeops_security_front_door_active'',
          ''input_boolean.homeops_security_garage_active'', ''input_boolean.homeops_health_front_door_unavailable'',
          ''input_boolean.homeops_health_garage_unavailable'', ''input_boolean.homeops_health_jd_location_stale'',
          ''input_boolean.homeops_health_sam_location_stale'', ''input_boolean.homeops_health_backup_stale'',
          ''input_boolean.homeops_health_disk_pressure''] | select(''is_state'',''on'')
          | list | count) == 0 %}No security or monitoring incidents · alerts active{%
          else %}See Alerts for details{% endif %}'
        icon: '{{ ''mdi:shield-check'' if ([''input_boolean.homeops_security_front_door_active'',
          ''input_boolean.homeops_security_garage_active'', ''input_boolean.homeops_health_front_door_unavailable'',
          ''input_boolean.homeops_health_garage_unavailable'', ''input_boolean.homeops_health_jd_location_stale'',
          ''input_boolean.homeops_health_sam_location_stale'', ''input_boolean.homeops_health_backup_stale'',
          ''input_boolean.homeops_health_disk_pressure''] | select(''is_state'',''on'')
          | list | count) == 0 else ''mdi:shield-alert'' }}'
        icon_color: '{{ ''green'' if ([''input_boolean.homeops_security_front_door_active'',
          ''input_boolean.homeops_security_garage_active'', ''input_boolean.homeops_health_front_door_unavailable'',
          ''input_boolean.homeops_health_garage_unavailable'', ''input_boolean.homeops_health_jd_location_stale'',
          ''input_boolean.homeops_health_sam_location_stale'', ''input_boolean.homeops_health_backup_stale'',
          ''input_boolean.homeops_health_disk_pressure''] | select(''is_state'',''on'')
          | list | count) == 0 else ''red'' }}'
        tap_action:
          action: navigate
          navigation_path: /dashboard-home-operations/alerts
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        multiline_secondary: true
      - type: markdown
        content: '{% set sn = states(''input_datetime.homeops_snooze_until'') %}Notifications
          this incident — front door: **{{ states(''input_number.homeops_security_front_door_notification_count'')|int(0)
          }}** · garage: **{{ states(''input_number.homeops_security_garage_notification_count'')|int(0)
          }}**.'
      column_span: 3
    - type: grid
      cards:
      - type: heading
        heading: Incident & monitoring state
        heading_style: title
        icon: mdi:list-status
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:mushroom-template-card
          primary: Front door risk
          secondary: '{{ ''Active'' if is_state(''input_boolean.homeops_security_front_door_active'',''on'')
            else ''Clear'' }}'
          icon: mdi:door-open
          icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_security_front_door_active'',''on'')
            else ''green'' }}'
          tap_action:
            action: none
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
        - type: custom:mushroom-template-card
          primary: Garage door risk
          secondary: '{{ ''Active'' if is_state(''input_boolean.homeops_security_garage_active'',''on'')
            else ''Clear'' }}'
          icon: mdi:garage-open
          icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_security_garage_active'',''on'')
            else ''green'' }}'
          tap_action:
            action: none
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
        - type: custom:mushroom-template-card
          primary: Front door monitoring unavailable
          secondary: '{{ ''Active'' if is_state(''input_boolean.homeops_health_front_door_unavailable'',''on'')
            else ''Clear'' }}'
          icon: mdi:lock-alert
          icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_health_front_door_unavailable'',''on'')
            else ''green'' }}'
          tap_action:
            action: none
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
        - type: custom:mushroom-template-card
          primary: Garage monitoring unavailable
          secondary: '{{ ''Active'' if is_state(''input_boolean.homeops_health_garage_unavailable'',''on'')
            else ''Clear'' }}'
          icon: mdi:garage-alert
          icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_health_garage_unavailable'',''on'')
            else ''green'' }}'
          tap_action:
            action: none
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
        - type: custom:mushroom-template-card
          primary: JD's phone location
          secondary: '{{ ''Active'' if is_state(''input_boolean.homeops_health_jd_location_stale'',''on'')
            else ''Clear'' }}'
          icon: mdi:cellphone-marker
          icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_health_jd_location_stale'',''on'')
            else ''green'' }}'
          tap_action:
            action: none
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
        - type: custom:mushroom-template-card
          primary: Sam's phone location
          secondary: '{{ ''Active'' if is_state(''input_boolean.homeops_health_sam_location_stale'',''on'')
            else ''Clear'' }}'
          icon: mdi:cellphone-marker
          icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_health_sam_location_stale'',''on'')
            else ''green'' }}'
          tap_action:
            action: none
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
        - type: custom:mushroom-template-card
          primary: Automatic backup
          secondary: '{{ ''Active'' if is_state(''input_boolean.homeops_health_backup_stale'',''on'')
            else ''Clear'' }}'
          icon: mdi:backup-restore
          icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_health_backup_stale'',''on'')
            else ''green'' }}'
          tap_action:
            action: none
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
        - type: custom:mushroom-template-card
          primary: Home Assistant disk pressure
          secondary: '{{ ''Active'' if is_state(''input_boolean.homeops_health_disk_pressure'',''on'')
            else ''Clear'' }}'
          icon: mdi:harddisk-remove
          icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_health_disk_pressure'',''on'')
            else ''green'' }}'
          tap_action:
            action: none
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
      column_span: 2
    - type: grid
      cards:
      - type: heading
        heading: Controls
        heading_style: title
        icon: mdi:tune-variant
      - type: entities
        title: Enable alerts
        show_header_toggle: false
        entities:
        - input_boolean.homeops_presence_alerts_enabled
        - input_boolean.homeops_security_alerts_enabled
        - input_boolean.homeops_health_alerts_enabled
        - input_boolean.homeops_digest_enabled
        - input_boolean.homeops_health_include_sam
      - type: entities
        title: Timing
        show_header_toggle: false
        entities:
        - input_datetime.homeops_security_night_start
        - input_datetime.homeops_security_night_end
        - input_number.homeops_security_followup_minutes
