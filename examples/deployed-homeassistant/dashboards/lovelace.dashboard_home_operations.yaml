  - type: sections
    title: Calendar
    path: calendar
    icon: mdi:calendar-month-outline
    max_columns: 3
    sections:
    - type: grid
      cards:
      - type: heading
        heading: Family calendar
        heading_style: title
        icon: mdi:calendar-month-outline
      - type: calendar
        entities:
        - calendar.family
        initial_view: listWeek
      column_span: 2
    - type: grid
      cards:
      - type: heading
        heading: Source status
        heading_style: title
        icon: mdi:calendar-sync-outline
      - type: custom:mushroom-template-card
        primary: Google
        secondary: Connected · Family calendar supplies the agenda
        icon: mdi:google
        icon_color: green
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        multiline_secondary: true
      - type: custom:mushroom-template-card
        primary: Outlook
        secondary: Sign-in complete, but Microsoft rejected calendar access (HTTP
          401); no entity yet
        icon: mdi:microsoft-outlook
        icon_color: orange
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        multiline_secondary: true
      - type: markdown
        content: <sub>Only the shared Family calendar is shown; personal, work, birthday,
          holiday, Todoist and automated calendars are excluded. No automatic reminders
          are enabled.</sub>
  - type: sections
    title: Maintenance
    path: maintenance
    icon: mdi:tools
    max_columns: 3
    sections:
    - type: grid
      cards:
      - type: heading
        heading: Backup
        heading_style: title
        icon: mdi:backup-restore
      - type: custom:mushroom-template-card
        primary: Automatic backup
        secondary: '{% set l = states(''sensor.backup_last_successful_automatic_backup'')
          %}{% if l in [''unknown'',''unavailable''] %}No successful-backup timestamp{%
          else %}{{ as_local(as_datetime(l)).strftime(''%b %-d at %-I:%M %p'') }}
          ({{ relative_time(as_datetime(l)) }} ago){% endif %} · manager {{ states(''sensor.backup_backup_manager_state'')
          | replace(''_'','' '') }}'
        icon: mdi:cloud-check-outline
        icon_color: '{{ ''red'' if is_state(''input_boolean.homeops_health_backup_stale'',''on'')
          else ''green'' }}'
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        multiline_secondary: true
      - type: entities
        title: Schedule
        show_header_toggle: false
        entities:
        - entity: sensor.backup_last_attempted_automatic_backup
          name: Last attempt
        - entity: sensor.backup_next_scheduled_automatic_backup
          name: Next scheduled
      - type: markdown
        content: '**Off-system archive (PRO-05)** — 141,037 snapshots and 154 Home
          Assistant backups, checksum-verified through Sep 18, 6:26 PM CDT. Daily
          pull at 6:00 AM while jd is logged on and PRO-05 is awake; failures raise
          a persistent notification.


          **Camera snapshots** — full verified history on PRO-05; most recent 30 days
          (37,583 files, 2.47 GB) kept on Home Assistant.'
    - type: grid
      cards:
      - type: heading
        heading: Storage & connectivity
        heading_style: title
        icon: mdi:harddisk
      - type: gauge
        entity: sensor.system_monitor_disk_usage_config
        name: /config used
        min: 0
        max: 100
        needle: true
        severity:
          green: 0
          yellow: 80
          red: 85
      - type: custom:mushroom-template-card
        primary: Free space
        secondary: '{{ states(''sensor.system_monitor_disk_free_config'') }} GiB available
          on /config'
        icon: mdi:harddisk
        icon_color: blue
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
        - type: template
          content: Gateway {{ 'up' if is_state('binary_sensor.10_0_0_1','on') else
            'down' }}
          icon: mdi:router-network
          icon_color: '{{ ''green'' if is_state(''binary_sensor.10_0_0_1'',''on'')
            else ''red'' }}'
          tap_action:
            action: none
        - type: template
          content: Internet {{ 'up' if is_state('binary_sensor.1_1_1_1','on') else
            'down' }}
          icon: mdi:web
          icon_color: '{{ ''green'' if is_state(''binary_sensor.1_1_1_1'',''on'')
            else ''red'' }}'
          tap_action:
            action: none
      - type: entities
        title: Disk health thresholds
        show_header_toggle: false
        entities:
        - input_number.homeops_disk_warning_percent
        - input_number.homeops_disk_recovery_percent
    - type: grid
      cards:
      - type: heading
        heading: Devices
        heading_style: title
        icon: mdi:battery-heart-variant
      - type: custom:mushroom-entity-card
        entity: sensor.front_door_deadbolt_battery_level
        name: Front door lock
        fill_container: true
      - type: custom:mushroom-entity-card
        entity: sensor.jd_s23_ultra_battery_level
        name: JD's phone
        fill_container: true
      - type: custom:mushroom-entity-card
        entity: sensor.samsung_s23_ultra_battery_level
        name: Sam's phone
        fill_container: true
      - type: markdown
        content: '{% if states(''lock.front_door_deadbolt'') in [''unknown'',''unavailable'']
          %}**Door monitoring disconnected:** Home Assistant cannot reach the external
          Z-Wave JS server, so front-door security cannot be confirmed.{% elif is_state(''lock.front_door_deadbolt'',''jammed'')
          %}**Lock fault:** the front door reports jammed.{% else %}Door monitoring
          healthy.{% endif %}'
