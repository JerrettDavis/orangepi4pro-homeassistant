config:
  title: Vehicle leases
  views:
  - type: sections
    title: Overview
    path: overview
    icon: mdi:car-multiple
    max_columns: 2
    sections:
    - type: grid
      cards:
      - type: heading
        heading: Vehicle leases
        heading_style: title
        icon: mdi:car-multiple
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.lease_driving_guidance'') }}'
        secondary: 'Combined projected excess-mile fees: ${{ states(''sensor.lease_combined_projected_cost'')|float(0)|round(0)|int
          }} · {{ states(''sensor.lease_ioniq_remaining_days'')|float(0)|round(0)|int
          }} days to lease end'
        icon: mdi:speedometer
        icon_color: '{{ ''red'' if ''over'' in states(''sensor.lease_driving_guidance'')|lower
          else ''green'' }}'
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        multiline_secondary: true
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
        - type: template
          content: Ioniq 24,000 mi / 24 mo
          icon: mdi:car-electric
          icon_color: ''
          tap_action:
            action: none
        - type: template
          content: Charger 30,000 mi / 24 mo
          icon: mdi:car-sports
          icon_color: ''
          tap_action:
            action: none
        - type: template
          content: $0.10 per excess mile
          icon: mdi:cash-multiple
          icon_color: ''
          tap_action:
            action: none
        - type: template
          content: Lease end Sep 30, 2027
          icon: mdi:calendar-end
          icon_color: ''
          tap_action:
            action: none
      - type: custom:mushroom-chips-card
        chips:
        - type: entity
          entity: input_boolean.lease_notifications_enabled
          icon: mdi:bell-outline
          content_info: name
          name: Push alerts
        - type: entity
          entity: input_boolean.lease_charger_unavailable
          icon: mdi:car-wrench
          content_info: name
          name: Charger in repair
      column_span: 2
    - type: grid
      cards:
      - type: heading
        heading: Ioniq 5 N
        heading_style: title
        icon: mdi:car-electric
      - type: custom:mushroom-template-card
        primary: Ioniq 5 N
        secondary: '{% if not is_number(states(''sensor.lease_ioniq_monthly_miles''))
          %}Waiting for mileage data{% elif is_state(''binary_sensor.lease_ioniq_monthly_over_budget'',''on'')
          %}Over this month''s allowance{% elif states(''sensor.lease_ioniq_month_pace_delta'')|float(0)
          > states(''input_number.lease_warning_pace_miles'')|float(100) %}Ahead of
          this month''s pace{% else %}Within this month''s pace{% endif %} · {{ states(''sensor.lease_ioniq_monthly_miles'')|float(0)|round(0)|int
          }} of {{ states(''sensor.lease_ioniq_monthly_allowance'')|float(0)|round(0)|int
          }} mi this month'
        icon: mdi:car-electric
        icon_color: '{% if is_state(''binary_sensor.lease_ioniq_monthly_over_budget'',''on'')
          %}red{% elif states(''sensor.lease_ioniq_month_pace_delta'')|float(0) >
          states(''input_number.lease_warning_pace_miles'')|float(100) %}orange{%
          else %}green{% endif %}'
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        entity: sensor.2025_ioniq_5_n_odometer
      - type: custom:button-card
        entity: sensor.lease_ioniq_projected_miles
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
        triggers_update: all
        custom_fields:
          body: "[[[\nconst v = 'ioniq';\nconst num = id => { const s = hass.states[id];\
            \ const n = s ? parseFloat(s.state) : NaN; return isNaN(n) ? 0 : n; };\n\
            const fmt = n => Math.round(n).toLocaleString();\nconst money = n => '$'\
            \ + Math.round(n).toLocaleString();\nconst used = num(`sensor.lease_${v}_used_miles`),\
            \ total = num(`sensor.lease_${v}_total_allowance`) || 1;\nconst proj =\
            \ num(`sensor.lease_${v}_projected_miles`), fee = num(`sensor.lease_${v}_projected_cost`);\n\
            const remaining = num(`sensor.lease_${v}_remaining_miles`), safe = num(`sensor.lease_${v}_safe_monthly_miles`);\n\
            const weighted = num(`sensor.lease_${v}_weighted_monthly_miles`);\nconst\
            \ st = hass.states[`input_datetime.lease_${v}_start`], en = hass.states[`input_datetime.lease_${v}_end`];\n\
            let timePct = 0;\nif (st && en) { const a = new Date(st.state + 'T00:00:00'),\
            \ b = new Date(en.state + 'T23:59:59');\n  timePct = Math.min(100, Math.max(0,\
            \ (Date.now() - a) / (b - a) * 100)); }\nconst scale = Math.max(total,\
            \ proj, used) * 1.04;\nconst p = n => Math.min(100, n / scale * 100).toFixed(1);\n\
            const over = proj > total, ahead = used / total * 100 > timePct + 3;\n\
            const color = over ? '#e53935' : (ahead ? '#fb8c00' : '#43a047');\nconst\
            \ label = over ? 'Projected over' : (ahead ? 'Ahead of pace' : 'On track');\n\
            const stat = (k, val, sub) => `<div style=\"flex:1;min-width:92px\"><div\
            \ style=\"font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.04em\"\
            >${k}</div><div style=\"font-size:20px;font-weight:600\">${val}</div><div\
            \ style=\"font-size:11px;opacity:.6\">${sub || '&nbsp;'}</div></div>`;\n\
            return `\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px\"\
            >\n  <div style=\"font-size:12px;opacity:.7\">Lease miles used vs. allowance</div>\n\
            \  <div style=\"background:${color};color:#fff;border-radius:12px;padding:2px\
            \ 10px;font-size:12px;font-weight:600\">${label}</div>\n</div>\n<div style=\"\
            position:relative;height:18px;background:var(--divider-color,#8883);border-radius:9px;overflow:visible\"\
            >\n  <div style=\"position:absolute;left:0;top:0;height:100%;width:${p(proj)}%;background:${color};opacity:.28;border-radius:9px\"\
            ></div>\n  <div style=\"position:absolute;left:0;top:0;height:100%;width:${p(used)}%;background:${color};border-radius:9px\"\
            ></div>\n  <div title=\"Time elapsed\" style=\"position:absolute;left:${p(total\
            \ * timePct / 100)}%;top:-4px;height:26px;width:3px;background:var(--primary-text-color);border-radius:2px\"\
            ></div>\n  <div title=\"Allowance\" style=\"position:absolute;left:${p(total)}%;top:-4px;height:26px;width:2px;background:var(--primary-text-color);opacity:.5\"\
            ></div>\n</div>\n<div style=\"position:relative;height:16px;font-size:11px;opacity:.7;margin-top:6px\"\
            >\n  <span style=\"position:absolute;left:${p(total * timePct / 100)}%;transform:translateX(-50%)\"\
            >today ${timePct.toFixed(0)}%</span>\n  <span style=\"position:absolute;right:0\"\
            >${fmt(total)} mi allowance</span>\n</div>\n<div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:14px\"\
            >\n  ${stat('Driven', fmt(used) + ' mi', (used / total * 100).toFixed(0)\
            \ + '% of allowance')}\n  ${stat('Remaining', fmt(remaining) + ' mi',\
            \ 'safe ' + fmt(safe) + ' mi/mo')}\n  ${stat('At lease end', fmt(proj)\
            \ + ' mi', over ? '+' + fmt(proj - total) + ' over' : 'within allowance')}\n\
            \  ${stat('Projected fee', money(fee), 'pace ' + fmt(weighted) + ' mi/mo')}\n\
            </div>`;\n]]]"
        styles:
          card:
          - padding: 16px
          - border-radius: var(--ha-card-border-radius,12px)
          grid:
          - grid-template-areas: '"body"'
          - grid-template-columns: 1fr
          custom_fields:
            body:
            - width: 100%
            - text-align: left
      - type: grid
        columns: 2
        square: false
        cards:
        - type: gauge
          entity: sensor.lease_ioniq_monthly_percent
          name: Month allowance used
          min: 0
          max: 150
          needle: true
          severity:
            green: 0
            yellow: 80
            red: 100
        - type: gauge
          entity: sensor.lease_ioniq_projected_cost
          name: Projected fee
          min: 0
          max: 500
          unit: USD
          needle: true
          severity:
            green: 0
            yellow: 1
            red: 150
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
        - type: template
          content: '{% if is_state(''input_boolean.lease_ioniq_terms_confirmed'',''on'')
            %}Terms confirmed{% else %}Dates provisional{% endif %}'
          icon: mdi:file-document-check-outline
          icon_color: '{{ ''green'' if is_state(''input_boolean.lease_ioniq_terms_confirmed'',''on'')
            else ''orange'' }}'
          tap_action:
            action: none
        - type: template
          content: '{% set h = states(''sensor.lease_ioniq_data_age_hours'')|float(999)
            %}{% if h > 72 %}Data {{ (h/24)|round(0)|int }}d old{% else %}Data {{
            h|round(1) }} h old{% endif %}'
          icon: mdi:database-clock-outline
          icon_color: '{{ ''red'' if states(''sensor.lease_ioniq_data_age_hours'')|float(999)
            > 72 else ''grey'' }}'
          tap_action:
            action: none
    - type: grid
      cards:
      - type: heading
        heading: Dodge Charger
        heading_style: title
        icon: mdi:car-sports
      - type: custom:mushroom-template-card
        primary: Dodge Charger
        secondary: '{% if not is_number(states(''sensor.lease_charger_monthly_miles''))
          %}Waiting for mileage data{% elif is_state(''binary_sensor.lease_charger_monthly_over_budget'',''on'')
          %}Over this month''s allowance{% elif states(''sensor.lease_charger_month_pace_delta'')|float(0)
          > states(''input_number.lease_warning_pace_miles'')|float(100) %}Ahead of
          this month''s pace{% else %}Within this month''s pace{% endif %} · {{ states(''sensor.lease_charger_monthly_miles'')|float(0)|round(0)|int
          }} of {{ states(''sensor.lease_charger_monthly_allowance'')|float(0)|round(0)|int
          }} mi this month'
        icon: mdi:car-sports
        icon_color: '{% if is_state(''binary_sensor.lease_charger_monthly_over_budget'',''on'')
          %}red{% elif states(''sensor.lease_charger_month_pace_delta'')|float(0)
          > states(''input_number.lease_warning_pace_miles'')|float(100) %}orange{%
          else %}green{% endif %}'
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: true
        entity: sensor.dodge_charger_odometer
      - type: custom:button-card
        entity: sensor.lease_charger_projected_miles
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
        triggers_update: all
        custom_fields:
          body: "[[[\nconst v = 'charger';\nconst num = id => { const s = hass.states[id];\
            \ const n = s ? parseFloat(s.state) : NaN; return isNaN(n) ? 0 : n; };\n\
            const fmt = n => Math.round(n).toLocaleString();\nconst money = n => '$'\
            \ + Math.round(n).toLocaleString();\nconst used = num(`sensor.lease_${v}_used_miles`),\
            \ total = num(`sensor.lease_${v}_total_allowance`) || 1;\nconst proj =\
            \ num(`sensor.lease_${v}_projected_miles`), fee = num(`sensor.lease_${v}_projected_cost`);\n\
            const remaining = num(`sensor.lease_${v}_remaining_miles`), safe = num(`sensor.lease_${v}_safe_monthly_miles`);\n\
            const weighted = num(`sensor.lease_${v}_weighted_monthly_miles`);\nconst\
            \ st = hass.states[`input_datetime.lease_${v}_start`], en = hass.states[`input_datetime.lease_${v}_end`];\n\
            let timePct = 0;\nif (st && en) { const a = new Date(st.state + 'T00:00:00'),\
            \ b = new Date(en.state + 'T23:59:59');\n  timePct = Math.min(100, Math.max(0,\
            \ (Date.now() - a) / (b - a) * 100)); }\nconst scale = Math.max(total,\
            \ proj, used) * 1.04;\nconst p = n => Math.min(100, n / scale * 100).toFixed(1);\n\
            const over = proj > total, ahead = used / total * 100 > timePct + 3;\n\
            const color = over ? '#e53935' : (ahead ? '#fb8c00' : '#43a047');\nconst\
            \ label = over ? 'Projected over' : (ahead ? 'Ahead of pace' : 'On track');\n\
            const stat = (k, val, sub) => `<div style=\"flex:1;min-width:92px\"><div\
            \ style=\"font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.04em\"\
            >${k}</div><div style=\"font-size:20px;font-weight:600\">${val}</div><div\
            \ style=\"font-size:11px;opacity:.6\">${sub || '&nbsp;'}</div></div>`;\n\
            return `\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px\"\
            >\n  <div style=\"font-size:12px;opacity:.7\">Lease miles used vs. allowance</div>\n\
            \  <div style=\"background:${color};color:#fff;border-radius:12px;padding:2px\
            \ 10px;font-size:12px;font-weight:600\">${label}</div>\n</div>\n<div style=\"\
            position:relative;height:18px;background:var(--divider-color,#8883);border-radius:9px;overflow:visible\"\
            >\n  <div style=\"position:absolute;left:0;top:0;height:100%;width:${p(proj)}%;background:${color};opacity:.28;border-radius:9px\"\
            ></div>\n  <div style=\"position:absolute;left:0;top:0;height:100%;width:${p(used)}%;background:${color};border-radius:9px\"\
            ></div>\n  <div title=\"Time elapsed\" style=\"position:absolute;left:${p(total\
            \ * timePct / 100)}%;top:-4px;height:26px;width:3px;background:var(--primary-text-color);border-radius:2px\"\
            ></div>\n  <div title=\"Allowance\" style=\"position:absolute;left:${p(total)}%;top:-4px;height:26px;width:2px;background:var(--primary-text-color);opacity:.5\"\
            ></div>\n</div>\n<div style=\"position:relative;height:16px;font-size:11px;opacity:.7;margin-top:6px\"\
            >\n  <span style=\"position:absolute;left:${p(total * timePct / 100)}%;transform:translateX(-50%)\"\
            >today ${timePct.toFixed(0)}%</span>\n  <span style=\"position:absolute;right:0\"\
            >${fmt(total)} mi allowance</span>\n</div>\n<div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:14px\"\
            >\n  ${stat('Driven', fmt(used) + ' mi', (used / total * 100).toFixed(0)\
            \ + '% of allowance')}\n  ${stat('Remaining', fmt(remaining) + ' mi',\
            \ 'safe ' + fmt(safe) + ' mi/mo')}\n  ${stat('At lease end', fmt(proj)\
            \ + ' mi', over ? '+' + fmt(proj - total) + ' over' : 'within allowance')}\n\
            \  ${stat('Projected fee', money(fee), 'pace ' + fmt(weighted) + ' mi/mo')}\n\
            </div>`;\n]]]"
        styles:
          card:
          - padding: 16px
          - border-radius: var(--ha-card-border-radius,12px)
          grid:
          - grid-template-areas: '"body"'
          - grid-template-columns: 1fr
          custom_fields:
            body:
            - width: 100%
            - text-align: left
      - type: grid
        columns: 2
        square: false
        cards:
        - type: gauge
          entity: sensor.lease_charger_monthly_percent
          name: Month allowance used
          min: 0
          max: 150
          needle: true
          severity:
            green: 0
            yellow: 80
            red: 100
        - type: gauge
          entity: sensor.lease_charger_projected_cost
          name: Projected fee
          min: 0
          max: 500
          unit: USD
          needle: true
          severity:
            green: 0
            yellow: 1
            red: 150
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
        - type: template
          content: '{% if is_state(''input_boolean.lease_charger_terms_confirmed'',''on'')
            %}Terms confirmed{% else %}Dates provisional{% endif %}'
          icon: mdi:file-document-check-outline
          icon_color: '{{ ''green'' if is_state(''input_boolean.lease_charger_terms_confirmed'',''on'')
            else ''orange'' }}'
          tap_action:
            action: none
        - type: template
          content: '{% set h = states(''sensor.lease_charger_data_age_hours'')|float(999)
            %}{% if h > 72 %}Data {{ (h/24)|round(0)|int }}d old{% else %}Data {{
            h|round(1) }} h old{% endif %}'
          icon: mdi:database-clock-outline
          icon_color: '{{ ''red'' if states(''sensor.lease_charger_data_age_hours'')|float(999)
            > 72 else ''grey'' }}'
          tap_action:
            action: none
    - type: grid
      cards:
      - type: heading
        heading: Trends
        heading_style: title
        icon: mdi:chart-line
      - type: statistics-graph
        title: Odometer · last 90 days
        chart_type: line
        period: day
        days_to_show: 90
        stat_types:
        - state
        entities:
        - entity: sensor.2025_ioniq_5_n_odometer
          name: Ioniq 5 N
        - entity: sensor.dodge_charger_odometer
          name: Dodge Charger
      - type: statistics-graph
        title: Daily miles · last 30 days
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
        - change
        entities:
        - entity: sensor.2025_ioniq_5_n_odometer
          name: Ioniq 5 N
        - entity: sensor.dodge_charger_odometer
          name: Dodge Charger
      - type: history-graph
        title: Pace gap · positive means ahead of budget
        hours_to_show: 168
        entities:
        - entity: sensor.lease_ioniq_pace_delta
          name: Ioniq 5 N
        - entity: sensor.lease_charger_pace_delta
          name: Dodge Charger
      column_span: 2
    - type: grid
      cards:
      - type: markdown
        content: <sub>Projections weight the last 7 days (default 60%) and 30 days
          (40%) and assume that pace continues to lease end. Excess-mile fees use
          each vehicle's total contract allowance; unused miles on one lease do not
          offset the other. Costs are estimates at the rate entered under Setup. The
          Charger's repair-period pace is not representative of normal use.</sub>
      column_span: 2
  - type: sections
    title: Details
    path: details
    icon: mdi:table-large
    max_columns: 2
    sections:
    - type: grid
      cards:
      - type: heading
        heading: Calculation detail
        heading_style: title
        icon: mdi:table-large
      - type: markdown
        content: Every figure behind the Overview, grouped by vehicle.
      column_span: 2
    - type: grid
      cards:
      - type: heading
        heading: Ioniq 5 N
        heading_style: title
        icon: mdi:car-electric
      - type: entities
        title: Month & lease
        show_header_toggle: false
        entities:
        - entity: sensor.lease_ioniq_monthly_miles
          name: Miles this calendar month
        - entity: sensor.lease_ioniq_monthly_allowance
          name: Monthly allowance
        - entity: sensor.lease_ioniq_month_pace_delta
          name: Ahead (+) / behind (−) month pace
        - entity: sensor.lease_ioniq_monthly_overage
          name: Over full monthly allowance
        - entity: sensor.lease_ioniq_monthly_overage_cost
          name: This month excess fee
        - entity: sensor.lease_ioniq_current_budget_overage
          name: Over cumulative budget today
        - entity: sensor.lease_ioniq_current_budget_cost
          name: Current budget overage fee
        - entity: sensor.lease_ioniq_pace_delta
          name: Ahead (+) / behind (−) lease pace
        - entity: sensor.lease_ioniq_remaining_miles
          name: Lease miles remaining
        - entity: sensor.lease_ioniq_safe_monthly_miles
          name: Monthly pace to stay within lease
      - type: entities
        title: Projections
        show_header_toggle: false
        entities:
        - entity: sensor.lease_ioniq_weighted_monthly_miles
          name: Weighted pace, monthly
        - entity: sensor.lease_ioniq_weekly_daily_miles
          name: Last 7 days, mi/day
        - entity: sensor.lease_ioniq_recent_daily_miles
          name: Last 30 days, mi/day
        - entity: sensor.lease_ioniq_projected_miles
          name: Lease-end miles, weighted pace
        - entity: sensor.lease_ioniq_lifetime_projected_miles
          name: Lease-end miles, lifetime pace
        - entity: sensor.lease_ioniq_projected_overage
          name: Projected excess miles
        - entity: sensor.lease_ioniq_projected_cost
          name: Projected excess-mile fee
        - entity: sensor.lease_ioniq_already_incurred_cost
          name: Fee if no more miles driven
        - entity: sensor.lease_ioniq_data_age_hours
          name: Vehicle data age (hours)
    - type: grid
      cards:
      - type: heading
        heading: Dodge Charger
        heading_style: title
        icon: mdi:car-sports
      - type: entities
        title: Month & lease
        show_header_toggle: false
        entities:
        - entity: sensor.lease_charger_monthly_miles
          name: Miles this calendar month
        - entity: sensor.lease_charger_monthly_allowance
          name: Monthly allowance
        - entity: sensor.lease_charger_month_pace_delta
          name: Ahead (+) / behind (−) month pace
        - entity: sensor.lease_charger_monthly_overage
          name: Over full monthly allowance
        - entity: sensor.lease_charger_monthly_overage_cost
          name: This month excess fee
        - entity: sensor.lease_charger_current_budget_overage
          name: Over cumulative budget today
        - entity: sensor.lease_charger_current_budget_cost
          name: Current budget overage fee
        - entity: sensor.lease_charger_pace_delta
          name: Ahead (+) / behind (−) lease pace
        - entity: sensor.lease_charger_remaining_miles
          name: Lease miles remaining
        - entity: sensor.lease_charger_safe_monthly_miles
          name: Monthly pace to stay within lease
      - type: entities
        title: Projections
        show_header_toggle: false
        entities:
        - entity: sensor.lease_charger_weighted_monthly_miles
          name: Weighted pace, monthly
        - entity: sensor.lease_charger_weekly_daily_miles
          name: Last 7 days, mi/day
        - entity: sensor.lease_charger_recent_daily_miles
          name: Last 30 days, mi/day
        - entity: sensor.lease_charger_projected_miles
          name: Lease-end miles, weighted pace
        - entity: sensor.lease_charger_lifetime_projected_miles
          name: Lease-end miles, lifetime pace
        - entity: sensor.lease_charger_projected_overage
          name: Projected excess miles
        - entity: sensor.lease_charger_projected_cost
          name: Projected excess-mile fee
        - entity: sensor.lease_charger_already_incurred_cost
          name: Fee if no more miles driven
        - entity: sensor.lease_charger_data_age_hours
          name: Vehicle data age (hours)
  - type: sections
    title: Downtime & savings
    path: downtime
    icon: mdi:car-wrench
    max_columns: 2
    sections:
    - type: grid
      cards:
      - type: heading
        heading: Charger downtime & Ioniq impact
        heading_style: title
        icon: mdi:car-wrench
      - type: markdown
        content: '{% if not is_state(''input_boolean.lease_downtime_baseline_confirmed'',''on'')
          %}**Start date estimated: March 8, 2026** (midpoint of an early-to-mid-March
          estimate); the range covers every start date March 1–15.{% else %}Incident
          baseline confirmed.{% endif %} Turn **Charger unavailable** off when it
          returns to freeze the record.'
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:mushroom-template-card
          primary: Downtime
          secondary: '{{ states(''sensor.lease_downtime_days'')|float(0)|round(0)|int
            }} days tracked'
          icon: mdi:car-wrench
          icon_color: orange
          tap_action:
            action: none
          hold_action:
            action: none
          layout: horizontal
          fill_container: true
        - type: custom:mushroom-template-card
