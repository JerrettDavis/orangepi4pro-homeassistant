  - title: Roadbox
    path: roadbox
    icon: mdi:car-connected
    type: sections
    max_columns: 3
    sections:
    - type: grid
      cards:
      - type: button
        name: Browse saved footage (Tailscale)
        icon: mdi:video-outline
        tap_action:
          action: url
          url_path: https://jdh-pro-05.tail2a279.ts.net/
      - type: heading
        heading: Pi power
        icon: mdi:power-plug-battery-outline
      - type: markdown
        title: Pi power
        content: '{% set stamp = as_timestamp(state_attr(''sensor.roadbox_power'',
          ''observed_at''), none) %}

          {% set age = as_timestamp(now()) - stamp if stamp is not none else none
          %}

          {% set fresh = age is not none and age >= 0 and age <= 45 and state_attr(''sensor.roadbox_power'',
          ''fresh'') is sameas true %}

          {% set source = states(''sensor.roadbox_power'') %}

          {% if not fresh %}### Power status unavailable or stale

          The Pi has stopped reporting. Last saved power state does not establish
          current power.

          {% elif source == ''external'' %}### External power connected

          {% elif source == ''battery'' %}### Running on battery

          {% else %}### Power signal unavailable

          {% endif %}

          {% set enabled = state_attr(''sensor.roadbox_power'', ''shutdown_enabled'')
          is sameas true %}

          {% if not enabled %}**Automatic shutdown disabled — commissioning.**

          {% elif fresh and state_attr(''sensor.roadbox_power'', ''phase'') == ''shutdown_requested''
          %}**Shutdown requested.** Restoration cannot cancel a shutdown already accepted.

          {% elif fresh and source == ''battery'' %}{% set deadline = as_timestamp(state_attr(''sensor.roadbox_power'',
          ''shutdown_at''), none) %}

          {% if deadline is not none %}**Shutdown scheduled for {{ deadline | timestamp_custom(''%H:%M:%S'',
          true) }}** (about {{ [0, (deadline - as_timestamp(now())) | round(0) | int]
          | max }} seconds remaining at this update). Reconnect input power to cancel
          before shutdown begins.

          {% else %}**Shutdown deadline unavailable.**{% endif %}

          {% elif fresh and source == ''external'' %}Automatic shutdown armed; power-loss
          grace period is 2 minutes.

          {% endif %}

          {% if fresh and state_attr(''sensor.roadbox_power'', ''fault'') %}**Power
          fault:** {{ state_attr(''sensor.roadbox_power'', ''fault'') }}{% endif %}


          **PiSugar S Plus · Battery percentage unavailable.** This model has no charge
          telemetry. External power presence does not confirm active charging.

          {% if stamp is not none %}Last observation: {{ stamp | timestamp_custom(''%m/%d
          %H:%M:%S'', true) }}. Readings older than 45 seconds are stale at the next
          refresh (up to one additional minute if the Pi stops reporting). This card
          is not a second-by-second timer.{% endif %}

          '
      - type: heading
        heading: Transfer now
        icon: mdi:cloud-download-outline
      - type: tile
        entity: sensor.roadbox_transfer
        name: Transfer to PC
      - type: tile
        entity: binary_sensor.roadbox_transfer_needed
        name: Footage waiting
        color: amber
      - type: tile
        entity: binary_sensor.roadbox_camera_card_missing
        name: Return camera SD card
        color: red
      - type: tile
        entity: binary_sensor.roadbox_camera_recovery
        name: Camera pause recovery
        color: red
      - type: markdown
        content: '{% set recovery = states(''binary_sensor.roadbox_camera_recovery'')
          %}

          {% if recovery == ''on'' %}**Camera recording restoration has not been confirmed.**
          The Pi retains the pause lease and retries recovery. An unreachable or powered-off
          camera cannot acknowledge recording.

          {% elif recovery == ''off'' %}No camera pause recovery is pending. This
          does not prove the camera is recording.

          {% else %}Camera pause recovery status is unknown.

          {% endif %}

          {% if not state_attr(''binary_sensor.roadbox_camera_recovery'',''fresh'')
          %}**The lease observation is unavailable or stale.** A previous recovery
          warning remains until a current Pi observation clears it.{% endif %}'
      - type: conditional
        conditions:
        - entity: binary_sensor.roadbox_camera_card_missing
          state: 'on'
        card:
          type: button
          entity: input_button.roadbox_camera_card_returned
          name: Card back in camera
          icon: mdi:micro-sd
          show_state: false
          tap_action:
            action: perform-action
            perform_action: input_button.press
            target:
              entity_id: input_button.roadbox_camera_card_returned
            confirmation:
              text: I have returned the SD card to the camera. Clear the reminder
                and allow wireless transfers?
      - type: markdown
        content: '{% set t = states(''sensor.roadbox_transfer'') %}

          {% set hb = states(''sensor.roadbox_heartbeat'') %}

          {% set age = as_timestamp(now()) - as_timestamp(hb,0) %}

          {% set healthy = hb not in [''unknown'',''unavailable''] and -5 <= age <
          180 and state_attr(''sensor.roadbox_heartbeat'',''healthy'') is sameas true
          %}

          ### {{ ''Last report'' if healthy else ''Monitor needs attention'' }} ·
          {{ t | title }}

          {% set verified = state_attr(''sensor.roadbox_archive'',''verified_bytes'')
          | float(0) %}

          {% set expected = state_attr(''sensor.roadbox_archive'',''expected_bytes'')
          | float(0) %}

          **{{ states(''sensor.roadbox_archive'') }} verified clips** · {{ ''%.2f''
          | format(verified / 1000000000) }} GB saved

          {% if expected > 0 %}{% set pct = [100, [0, 100 * verified / expected] |
          max] | min %}

          **Archive · {{ ''%.1f'' | format(pct) }}%**

          {% set filled = (pct / 5) | int %}

          `{{ ''█'' * filled }}{{ ''░'' * (20 - filled) }}`

          {{ ''%.2f'' | format(verified / 1000000000) }} / {{ ''%.1f'' | format(expected
          / 1000000000) }} GB verified

          {% else %}Archive size not yet known.{% endif %}

          {% set chunk = state_attr(''sensor.roadbox_transfer'',''inflight_bytes'')
          | float(0) %}

          {% set total = state_attr(''sensor.roadbox_transfer'',''inflight_total_bytes'')
          | float(0) %}

          {% if total > 0 %}{% set clip_pct = [100, [0, 100 * chunk / total] | max]
          | min %}

          **Current clip · {{ ''%.0f'' | format(clip_pct) }}%**

          {% set clip_filled = (clip_pct / 5) | int %}

          `{{ ''█'' * clip_filled }}{{ ''░'' * (20 - clip_filled) }}`

          {{ ''%.1f'' | format(chunk / 1000000) }} / {{ ''%.1f'' | format(total /
          1000000) }} MB

          {% else %}No clip currently in flight.{% endif %}


          {% set mode = state_attr(''sensor.roadbox_transfer'',''source_mode'') %}

          **{{ ''USB card'' if mode == ''usb_card'' else ''Camera Wi-Fi'' }} → Pi
          bridge → PC.** Completed clips are verified and skipped on reconnect.

          {% if is_state(''binary_sensor.roadbox_camera_card_missing'',''on'') %}**Return
          the SD card to the camera before driving.** {% if state_attr(''sensor.roadbox_transfer'',''safe_to_remove'')
          %}The card is safely unmounted; remove it from the reader.{% else %}Keep
          the reader connected until safe removal is confirmed.{% endif %}{% else
          %}Wireless imports start automatically when the camera is reachable and
          the vehicle is at home. USB cards take priority for catch-up copies.{% endif
          %}'
      - type: entities
        title: Car and monitor
        show_header_toggle: false
        entities:
        - entity: sensor.dodge_charger_hvbattery_charge
          name: Vehicle charge
        - entity: binary_sensor.dodge_charger_ignition
          name: Vehicle ignition
        - entity: device_tracker.dodge_charger_location
          name: Vehicle location
        - entity: sensor.roadbox_heartbeat
          name: Last monitor update
    - type: grid
      cards:
      - type: heading
        heading: Daily footage
        icon: mdi:calendar-check-outline
      - type: tile
        entity: sensor.roadbox_youtube
        name: YouTube processing
      - type: markdown
        content: '{% if not state_attr(''sensor.roadbox_youtube'',''fresh'') %}**YouTube
          worker status is unavailable or stale.** Saved day receipts remain visible,
          but an old uploading state does not establish current activity.

          {% elif is_state(''sensor.roadbox_youtube'',''waiting_for_youtube_processing'')
          %}**Uploads are waiting for owner processing confirmation.** Existing video
          IDs are retained and checked again without uploading duplicates.

          {% elif is_state(''sensor.roadbox_youtube'',''held_youtube_rejected'') %}**YouTube
          rejected an upload part.** Its rejection evidence is retained for review.

          {% endif %}

          All uploads remain private until residential privacy edits and review are
          implemented.'
      - type: markdown
        content: '{% for d in state_attr(''sensor.roadbox_days'',''days'') or [] %}

          {% set pct = [100, [0, 100 * d.verified / d.expected] | max] | min if d.expected
          > 0 else 0 %}

          **{{ d.day[4:6] }}/{{ d.day[6:8] }} · {{ ''%.0f'' | format(pct) }}% saved{{
          '' · Archive complete'' if d.complete else ('' · Upload held'' if not d.closed
          else '''') }}**

          {% set filled = (pct / 5) | int %}

          `{{ ''█'' * filled }}{{ ''░'' * (20 - filled) }}`

          Front {{ d.front.verified }}/{{ d.front.expected }} · Rear {{ d.rear.verified
          }}/{{ d.rear.expected }} · {{ d.verified }}/{{ d.expected }} clips verified

          {% if d.unavailable | default(0) | int(0) > 0 %}{{ d.unavailable }} clips
          confirmed unavailable; recorded as gaps.{% endif %}

          {% if d.unresolved | int(0) > 0 %}**{{ d.unresolved }} unresolved source
          gaps — upload held.**{% endif %}


          {% set uploads = state_attr(''sensor.roadbox_youtube'',''days'') or {} %}

          YouTube: **{{ (uploads.get(d.day, ''waiting for finalized day'')) | replace(''_'',''
          '') }}**


          {% endfor %}

          All available clips must be verified against a finalized inventory before
          upload. Confirmed unavailable footage is documented and does not block upload.
          All uploads remain private.'
      - type: history-graph
        title: Transfer activity · 12 hours
        hours_to_show: 12
        entities:
        - sensor.roadbox_transfer
        - binary_sensor.roadbox_transfer_needed
    - type: grid
      cards:
      - type: heading
        heading: Trips and next action
        icon: mdi:map-clock-outline
      - type: conditional
        conditions:
        - condition: state
          entity: binary_sensor.roadbox_transfer_needed
          state: 'on'
        card:
          type: markdown
          content: '### Footage is waiting

            If the transfer is active, let it continue. If it is waiting and the car
            is off, turn the car on when safe to power the camera. Keep camera power
            on until copying finishes.


            A Home Assistant notification appears when footage is waiting and camera/car
            power needs attention.'
      - type: markdown
        content: '### Likely recording windows

          {% for t in (state_attr(''sensor.roadbox_vehicle_history'',''likely_trips'')
          or [])[-5:] | reverse %}- {{ as_timestamp(t.start) | timestamp_custom(''%m/%d
          %H:%M'', true) }} – {{ as_timestamp(t.end) | timestamp_custom(''%H:%M'',
          true) }} · {{ ''uncertain'' if t.uncertain else ''likely'' }}

          {% else %}No retained recording windows are available.{% endfor %}


          {% set pending = state_attr(''sensor.roadbox_vehicle_history'',''pending_recording_windows'')
          or [] %}**{{ pending | length }} likely windows have no complete-day receipt.**
          These are estimates, not confirmed missing clips.


          History coverage: **{{ states(''sensor.roadbox_vehicle_history'') }}**.
          Sparse or missing readings stay uncertain. Location history does not certify
          a video is safe to publish.'
