        cards:
        - type: custom:mushroom-template-card
          primary: Avoided fees
          secondary: '{{ ''-'' if states(''sensor.lease_shift_projected_savings'')|float(0)
            < 0 }}${{ states(''sensor.lease_shift_projected_savings'')|float(0)|abs|round(0)|int
            }}'
          icon: mdi:piggy-bank-outline
