sensor:
- name: JDH Raw Packet Type
  unique_id: meshtastic_jdh_raw_packet_type
  default_entity_id: sensor.meshtastic_jdh_raw_packet_type
  state_topic: msh/US/2/json/JDH/#
  value_template: '{{ value_json.type | default(''unknown'') }}'
- name: JDH Position Debug
  unique_id: meshtastic_jdh_position_debug
  default_entity_id: sensor.meshtastic_jdh_position_debug
  state_topic: msh/US/2/json/JDH/#
  value_template: "{% if value_json.type == 'position'\n      and value_json.payload\
    \ is defined\n      and value_json.payload.latitude_i is defined\n      and value_json.payload.longitude_i\
    \ is defined %}\n  {{ value_json.get('from') }}:{{ (value_json.payload.latitude_i\
    \ | float) / 10000000 }},{{ (value_json.payload.longitude_i | float) / 10000000\
    \ }}\n{% else %}\n  {{ states('sensor.meshtastic_jdh_position_debug') }}\n{% endif\
    \ %}"
- name: Battery
  unique_id: meshtastic_jd01_battery
  default_entity_id: sensor.jd01_battery
  state_topic: msh/US/2/json/JDH/#
  value_template: "{% if value_json.get('from') == 4134541604\n      and value_json.type\
    \ == 'telemetry'\n      and value_json.payload is defined\n      and value_json.payload.battery_level\
    \ is defined %}\n  {{ value_json.payload.battery_level }}\n{% else %}\n  {{ states('sensor.jd01_battery')\
    \ }}\n{% endif %}"
  unit_of_measurement: '%'
  device_class: battery
  state_class: measurement
  device:
    identifiers:
    - meshtastic_jdh_4134541604
    name: JD Dev Base Station 001
    manufacturer: Meshtastic
    model: Heltec v4
- name: Voltage
  unique_id: meshtastic_jd01_voltage
  default_entity_id: sensor.jd01_voltage
  state_topic: msh/US/2/json/JDH/#
