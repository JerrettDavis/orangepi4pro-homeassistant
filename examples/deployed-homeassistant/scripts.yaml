homeops_send_jd:
  alias: HomeOps Send JD
  description: Recipient-isolated HomeOps sender. Dry-run emits an event and never
    contacts a phone.
  mode: parallel
  max: 20
  fields:
    title:
      required: true
      selector:
        text: {}
    message:
      required: true
      selector:
        text:
          multiline: true
    tag:
      required: true
      selector:
        text: {}
    dry_run:
      required: false
      default: false
      selector:
        boolean: {}
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ dry_run | default(false) | bool }}'
      sequence:
      - event: homeops_dry_run_notification
        event_data:
          recipient: jd
          title: '{{ title }}'
          message: '{{ message }}'
          tag: '{{ tag }}'
    default:
    - action: notify.mobile_app_jd_s23_ultra
      data:
        title: '{{ title }}'
        message: '{{ message }}'
        data:
          tag: '{{ tag }}'
          url: /dashboard-home-operations/alerts
          clickAction: /dashboard-home-operations/alerts
          ttl: 0
          priority: high
          channel: Home security
