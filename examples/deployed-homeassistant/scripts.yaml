homeops_snooze_one_hour:
  alias: HomeOps Snooze One Hour
  description: Snooze HomeOps notifications for one hour.
  mode: restart
  sequence:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.homeops_snooze_until
    data:
      datetime: '{{ (now()+timedelta(hours=1)).strftime(''%Y-%m-%d %H:%M:%S'') }}'
homeops_resume_alerts:
  alias: HomeOps Resume Alerts
  description: End the HomeOps notification snooze immediately.
  mode: restart
  sequence:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.homeops_snooze_until
    data:
      datetime: '2000-01-01 00:00:00'
