<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orange Pi Apps | synthetic UI preview</title><style>html,body{margin:0;height:100%;font:14px Arial,sans-serif;background:#f3f6fa;color:#172b41}.banner{height:42px;background:#12324b;color:#fff;display:flex;align-items:center;padding:0 20px;box-sizing:border-box}.shell{display:flex;height:calc(100% - 42px)}aside{box-sizing:border-box;width:210px;flex-shrink:0;background:white;border-right:1px solid #d9e1e8;padding:24px 14px}aside b{display:block;margin:0 9px 28px;font-size:18px}aside div{padding:12px;color:#64748b}aside .selected{background:#e0f3f2;color:#086e78;border-radius:9px}opiha-apps-tab{flex:1;min-width:0}@media(max-width:700px){aside{display:none}.banner{font-size:11px}}</style></head><body><div class="banner">UI PREVIEW · Synthetic data only. No connection to Docker, Home Assistant, your camera, or your house.</div><div class="shell"><aside><b>Home Assistant</b><div>Overview</div><div>Energy</div><div>History</div><div class="selected">Orange Pi Apps</div><div>Settings</div></aside><opiha-apps-tab></opiha-apps-tab></div><script type="module">
import '/apps.js';
const response=await fetch('/catalog.json');const apps=await response.json();
for(const app of apps){app.options=app.defaults;app.installed=app.id==='nodered';app.state=app.id==='nodered'?'running':(['go2rtc','zwave'].includes(app.id)?'externally_managed':'not_installed');}
const overview={version:'0.2.0-alpha.2',apps,resources:{memory_total:6120328396,memory_available:3984588800,disk_free:98784247808,cpu_count:8,load_average:[0.31,0.24,0.19],thermals:[],pressure:{}},reserve_mib:2048,allocated_limit_mib:768,active_job:null,supervisor:false,engine_error:null};let plan=null,job=null;
const copy=v=>JSON.parse(JSON.stringify(v));
const hass={user:{is_admin:true},callWS:async m=>{if(m.type!=='opiha_apps/request')throw Error('Bad WebSocket type');const d=m.data;switch(m.operation){case 'overview':case 'metrics':return copy(overview);case 'plan':plan={id:'synthetic-plan',app:d.app,action:d.action,options:d.options||apps.find(a=>a.id===d.app).options,expires:Date.now()/1000+300,preserves_data:true,changes_homeassistant:false,warnings:['Synthetic demo. No installation will occur.']};return copy(plan);case 'apply':if(d.id!==plan.id||d.confirm!==true)throw Error('Invalid approval contract');const app=apps.find(a=>a.id===plan.app);if(plan.action==='install'){app.installed=true;app.state='created';app.options=plan.options;}if(plan.action==='start'||plan.action==='restart')app.state='running';if(plan.action==='stop')app.state='exited';if(plan.action==='remove'){app.installed=false;app.state='data_retained';}job={id:'synthetic-job',app:app.id,action:plan.action,status:'succeeded',stage:'Demo operation completed. No host changes.'};return copy(job);case 'job':return copy(job);case 'logs':return {logs:'SYNTHETIC LOG\nThis is a browser preview, not an application runtime.'};case 'credentials':if(d.confirm!==true||Object.keys(d).length!==1)throw Error('Bad credential contract');return {username:'synthetic',password:'not-a-real-password'};default:throw Error('Unknown demo action');}},callApi:async(method,path,data)=>({url:`/api/opiha_apps/ingress/${data.app}/`,expires_in:300})};document.querySelector('opiha-apps-tab').hass=hass;
</script></body></html>
